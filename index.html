    if (!c.length) return `<div class="container"><div class="empty" style="padding-top:60px">${A.icon('cart', 44)}
      <h3>Tu cesta está vacía</h3><p class="small">Añade materiales desde el comparador.</p>
      <a class="btn" style="margin-top:16px" href="#/materiales">Ir al comparador</a></div></div>`;
    return `<div class="container" style="padding-top:18px;max-width:720px">

        <div class="sec-title">Cesta de materiales</div>
        <button class="link" id="c-clear">Vaciar</button>

        <button class="btn btn-block" id="c-quote" style="margin-top:12px">${A.icon('calc', 18)} Incluir en un presupuesto</button>
      </div>
      <div style="height:24px"></div>
    </div>`;

/* ============================================================
   views/render.js — Generador de renders con IA
   ============================================================ */
(function (A) {
  'use strict';

  let R = null;
  function init() {
    R = R || { room:'Cocina', style:'moderno', palette:'neutros', materials:['madera','porcelanico'],
      desc:'', photo:null, results:null, busy:false, sel:0, deg:0 };

  }

  A.route('/render', async () => {
    init();
    A.onMount(bind);
    const api = A.api.render;
    return `<div class="container" style="padding-top:16px;max-width:900px">

          <div class="sec-sub">Visualiza tu reforma antes de empezar</div></div>

        <div class="card card-p">
          <label class="label">1 · Foto del espacio actual</label>

            ${R.photo ? `<img src="${R.photo}" alt="Foto actual" style="width:100%;height:100%;object-fit:cover">`
              : `<div class="center muted" style="padding:20px">${A.icon('camera', 34)}
                  <div class="small" style="margin-top:8px">Toca para subir una foto<br>o hacerla con la cámara</div></div>`}
          </div>
          <input type="file" id="r-file" accept="image/*" capture="environment" style="display:none">
          ${R.photo ? '<button class="link small" id="r-clear" style="margin-top:8px">Quitar foto</button>' : ''}

          <hr class="divider">
          <label class="label">2 · Estancia</label>
          <div class="chips">${api.ROOMS.map((x) => `<button class="chip ${R.room === x ? 'sel' : ''}" data-room="${x}">${x}</button>`).join('')}</div>

          <hr class="divider">
          <label class="label">3 · Estilo</label>
          <div class="optgrid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
            ${api.STYLES.map((s) => `<button class="opt ${R.style === s.id ? 'sel' : ''}" data-style="${s.id}" style="padding:10px">
              <span class="check">${A.icon('check-circle', 15)}</span>
              <div class="row" style="gap:3px;margin-bottom:5px">
                ${s.pal.map((c) => `<span style="width:13px;height:13px;border-radius:4px;background:${c};display:inline-block"></span>`).join('')}</div>
              <div class="opt-t" style="font-size:13px">${A.esc(s.name)}</div>
              <div class="opt-d">${A.esc(s.desc)}</div></button>`).join('')}
          </div>

          <hr class="divider">
          <label class="label">4 · Colores predominantes</label>
          <div class="optgrid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
            ${api.PALETTES.map((p) => `<button class="opt ${R.palette === p.id ? 'sel' : ''}" data-pal="${p.id}" style="padding:10px">
              <span class="check">${A.icon('check-circle', 15)}</span>
              <div class="row" style="gap:3px;margin-bottom:5px">
                ${p.colors.map((c) => `<span style="width:18px;height:18px;border-radius:5px;background:${c};display:inline-block;border:1px solid rgba(0,0,0,.12)"></span>`).join('')}</div>
              <div class="opt-t" style="font-size:13px">${A.esc(p.name)}</div></button>`).join('')}
          </div>

          <hr class="divider">
          <label class="label">5 · Materiales a visualizar</label>
          <div class="chips" style="flex-wrap:wrap;overflow:visible">
            ${api.MATERIALS.map((m) => `<button class="chip ${R.materials.indexOf(m.id) !== -1 ? 'sel' : ''}" data-mat="${m.id}">${A.esc(m.name)}</button>`).join('')}
          </div>

          <hr class="divider">
          <label class="label">6 · Describe lo que quieres</label>
          <textarea class="textarea" id="r-desc" placeholder="Ej.: isla central con encimera clara, muebles hasta el techo, suelo de madera y mucha luz natural">${A.esc(R.desc)}</textarea>

          <button class="btn btn-accent btn-block btn-lg" id="r-go" style="margin-top:14px" ${R.busy ? 'disabled' : ''}>
            ${A.icon('sparkles', 19)} Generar 4 variaciones</button>
          <p class="small muted center" style="margin-top:8px">

        </div>

        <div id="r-out">${output()}</div>
      </div>
      <div style="height:24px"></div>
    </div>`;
  }, { title:'Render IA' });

  function output() {
    if (R.busy) {
      return `<div class="card card-p center" style="padding:40px 20px">
        <span class="spinner" style="width:34px;height:34px;color:var(--primary);margin:0 auto"></span>

          <img src="${im}" alt="Variación ${i + 1}" style="width:100%;height:100%;object-fit:cover"></button>`).join('')}
      </div>

      <div class="row wrap" style="gap:8px;margin-top:12px">
        <button class="btn btn-sm" id="r-360">${A.icon('refresh', 15)} Vista 360°</button>

      </details>
    </div>`;
  }

  function bind() {
    const file = A.$('#r-file'), drop = A.$('#r-drop');
    if (drop) drop.addEventListener('click', () => file.click());
    if (file) file.addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 8 * 1024 * 1024) { A.toast('La imagen supera los 8 MB', 'err'); return; }
      const fr = new FileReader();
      fr.onload = () => { R.photo = fr.result; A.render(); };
      fr.readAsDataURL(f);
    });
    const cl = A.$('#r-clear'); if (cl) cl.addEventListener('click', () => { R.photo = null; A.render(); });

    A.$$('[data-room]').forEach((b) => b.addEventListener('click', () => {
      R.room = b.dataset.room; A.$$('[data-room]').forEach((x) => x.classList.toggle('sel', x === b));
    }));
    A.$$('[data-style]').forEach((b) => b.addEventListener('click', () => {
      R.style = b.dataset.style; A.$$('[data-style]').forEach((x) => x.classList.toggle('sel', x === b));
    }));
    A.$$('[data-pal]').forEach((b) => b.addEventListener('click', () => {
      R.palette = b.dataset.pal; A.$$('[data-pal]').forEach((x) => x.classList.toggle('sel', x === b));
    }));
    A.$$('[data-mat]').forEach((b) => b.addEventListener('click', () => {
      const i = R.materials.indexOf(b.dataset.mat);
      if (i === -1) R.materials.push(b.dataset.mat); else R.materials.splice(i, 1);
      b.classList.toggle('sel');
    }));
    const d = A.$('#r-desc'); if (d) d.addEventListener('input', (e) => { R.desc = e.target.value; });

    const go = A.$('#r-go');
    if (go) go.addEventListener('click', async () => {
      R.busy = true; R.results = null; A.$('#r-out').innerHTML = output();
      const steps = ['Analizando la fotografía', 'Aplicando estilo y paleta', 'Colocando materiales', 'Ajustando iluminación'];
      try {
        const res = await A.api.render.generate({
          room:R.room, style:R.style, palette:R.palette, materials:R.materials, desc:R.desc, photo:R.photo,
          onProgress:(p, imgs) => {
            const bar = A.$('#r-bar'), pr = A.$('#r-prog');
            if (bar) bar.style.width = Math.round(p * 100) + '%';
            if (pr) pr.textContent = steps[Math.min(steps.length - 1, Math.floor(p * steps.length))];
          }
        }, 4);
        R.results = res; R.sel = 0;
      } catch (e) { A.toast(e.message, 'err'); }
      R.busy = false;
      A.$('#r-out').innerHTML = output();
      bindOut();
    });
    bindOut();
  }

  function bindOut() {
    A.$$('[data-sel]').forEach((b) => b.addEventListener('click', () => {
      R.sel = Number(b.dataset.sel); A.$('#r-out').innerHTML = output(); bindOut();
    }));
    const r360 = A.$('#r-360');
    if (r360) r360.addEventListener('click', () => {
      const img = A.$('#r-main');
      let a = 0; const t = setInterval(() => {
        a += 6; img.style.transition = 'transform .05s linear';
        img.style.transform = `perspective(900px) rotateY(${Math.sin(a / 180 * Math.PI) * 22}deg) scale(1.04)`;
        if (a >= 360) { clearInterval(t); img.style.transform = 'none'; }
      }, 22);
      A.toast('Simulación de vista 360°');
    });
    const dl = A.$('#r-dl');
    if (dl) dl.addEventListener('click', async () => {
      /* Se rasteriza a PNG para que la descarga funcione en cualquier visor */
      try {
        const src = R.results.images[R.sel];
        const img = new Image(); img.decoding = 'sync';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
        const c = document.createElement('canvas'); c.width = 1600; c.height = 1200;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
        const ok = await A.download(`render-${R.room}-${R.style}-${R.sel + 1}.png`, blob);
        if (ok) A.toast('Render descargado', 'ok');
      } catch (e) { A.toast('No se ha podido preparar la imagen', 'err'); }
    });
    const sh = A.$('#r-share');
    if (sh) sh.addEventListener('click', async () => {
      if (navigator.share) { try { await navigator.share({ title:'Mi render NOVA', text:`Render ${R.style} de mi ${R.room}` }); } catch (e) {} }
      else A.toast('Copia el enlace desde el navegador para compartir');
    });
    const sv = A.$('#r-save');
    if (sv) sv.addEventListener('click', async () => {
      await A.db.insert('renders', { user_id:A.state.user ? A.state.user.id : 'anon',
        room:R.room, style:R.style, palette:R.palette, materials:R.materials, desc:R.desc,
        image:R.results.images[R.sel], prompt:R.results.prompt });
      await A.notify('Render guardado', `${R.room} en estilo ${R.style}`, 'sparkles', '#/renders');
      A.toast('Render guardado', 'ok'); A.refreshBadge();
    });
    const qb = A.$('#r-quote');
    if (qb) qb.addEventListener('click', () => {
      const map = { Cocina:'ref-cocina', 'Baño':'ref-bano', Salón:'ref-suelos', Dormitorio:'ref-pintura',
        Terraza:'add-impermeabilizacion', Fachada:'add-aislamiento', Oficina:'ref-suelos', 'Local comercial':'con-tabiqueria' };
      A.go('/presupuesto/' + (map[R.room] || 'ref-cocina'));
    });
  }

  /* ---------------- Renders guardados ---------------- */
  A.route('/renders', async () => {
    const rows = await A.db.list('renders', A.state.user ? { user_id:A.state.user.id } : null);
    if (!rows.length) return `<div class="container"><div class="empty" style="padding-top:60px">${A.icon('sparkles', 44)}
      <h3>Aún no has guardado renders</h3><a class="btn" style="margin-top:16px" href="#/render">Crear render</a></div></div>`;
    return `<div class="container" style="padding-top:18px">
      <div class="sec-head" style="margin-top:0"><div class="sec-title">Mis renders</div>
        <a class="btn btn-sm" href="#/render">${A.icon('plus', 16)} Nuevo</a></div>
      <div class="grid g3">${rows.map((r) => `<div class="card" style="overflow:hidden">

        </div></div>`).join('')}</div><div style="height:20px"></div></div>`;
  }, { title:'Mis renders' });
})(window.App);

(function (A) {
  'use strict';

  /* Gráfico de barras en SVG (sin librerías) */
  function barChart(data, opts) {
    opts = opts || {};
    const W = 320, H = opts.h || 150, PAD = 8, BASE = H - 22;
    const max = Math.max(1, ...data.map((d) => d.v));
    const bw = (W - PAD * 2) / data.length;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <line x1="${PAD}" y1="${BASE}" x2="${W - PAD}" y2="${BASE}" stroke="var(--border)" stroke-width="1"/>
      ${data.map((d, i) => {
        const bh = (d.v / max) * (BASE - 22);
        const x = PAD + i * bw + bw * 0.2, bwidth = bw * 0.6;
        return `<rect x="${x.toFixed(1)}" y="${(BASE - bh).toFixed(1)}" width="${bwidth.toFixed(1)}"
            height="${Math.max(2, bh).toFixed(1)}" rx="3" fill="${d.c || 'var(--primary)'}">
            <title>${A.esc(d.l)}: ${A.esc(d.t || String(d.v))}</title></rect>
          <text x="${(x + bwidth / 2).toFixed(1)}" y="${BASE + 13}" text-anchor="middle"
            font-size="10" font-family="inherit" fill="var(--text-3)">${A.esc(d.l)}</text>
          ${d.v > 0 ? `<text x="${(x + bwidth / 2).toFixed(1)}" y="${(BASE - bh - 5).toFixed(1)}" text-anchor="middle"
            font-size="9.5" font-weight="700" font-family="inherit" fill="var(--text-2)">${A.esc(d.t || String(d.v))}</text>` : ''}`;
      }).join('')}
    </svg>`;
  }

  /* Gráfico de anillo */
  function donut(parts) {
    const total = parts.reduce((s, p) => s + p.v, 0) || 1;
    let acc = 0;
    const R = 38, C = 2 * Math.PI * R;
    return `<svg viewBox="0 0 100 100" style="width:120px;height:120px">
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--bg-sunken)" stroke-width="16"/>
      ${parts.map((p) => {
        const len = (p.v / total) * C;
        const el = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${p.c}" stroke-width="16"
          stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
          stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 50 50)"><title>${A.esc(p.l)}: ${p.v}</title></circle>`;
        acc += len; return el;
      }).join('')}
      <text x="50" y="49" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text)">${total}</text>
      <text x="50" y="60" text-anchor="middle" font-size="7" fill="var(--text-3)">presupuestos</text>
    </svg>`;
  }

  A.route('/admin', async () => {
    const [quotes, users, apps, pays, vals] = await Promise.all([

    ]);

    const won = quotes.filter((q) => ['aceptado', 'en_obra', 'finalizado'].indexOf(q.status) !== -1);
    const pipeline = quotes.filter((q) => ['borrador', 'enviado'].indexOf(q.status) !== -1);
    const revenue = won.reduce((s, q) => s + q.total, 0);
    const avg = quotes.length ? quotes.reduce((s, q) => s + q.total, 0) / quotes.length : 0;
    const conv = quotes.length ? (won.length / quotes.length) * 100 : 0;
    const collected = pays.reduce((s, p) => s + p.amount, 0);

    /* Serie de los últimos 6 meses */
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(); d.setMonth(d.getMonth() - i);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const v = quotes.filter((q) => String(q.created_at).slice(0, 7) === key)
        .reduce((s, q) => s + q.total, 0);
      months.push({ l:d.toLocaleDateString('es-ES', { month:'short' }), v, t:A.eur(v) });
    }

    /* Por categoría */
    const COLORS = ['#0B2545', '#25599A', '#C4841F', '#2E9E6B', '#64748B', '#7C5A38'];
    const byCat = A.data.CATEGORIES.map((c, i) => ({
      l:c.name, v:quotes.filter((q) => q.category === c.id).length, c:COLORS[i % COLORS.length]
    })).filter((x) => x.v > 0);

    const STATUS_L = { borrador:'Borrador', enviado:'Enviado', aceptado:'Aceptado', en_obra:'En obra', finalizado:'Finalizado', rechazado:'Rechazado' };

    A.onMount(() => {
      A.$$('[data-st]').forEach((s) => s.addEventListener('change', async (e) => {
        await A.db.update('quotes', s.dataset.st, { status:e.target.value });
        A.toast('Estado actualizado', 'ok');
      }));
      const on = A.$('#ad-demo-on');
      if (on) on.addEventListener('click', async () => {
        on.disabled = true; on.innerHTML = '<span class="spinner"></span> Generando…';
        await A.loadDemo(); A.toast('Datos de ejemplo cargados', 'ok'); A.render();
      });
      const off = A.$('#ad-demo-off');
      if (off) off.addEventListener('click', async () => {
        if (await A.confirm('Borrar datos de ejemplo', 'Se eliminarán solo los registros marcados como ejemplo. Tus datos reales no se tocan.', 'Borrar')) {
          await A.clearDemo(); A.toast('Ejemplos eliminados', 'ok'); A.render();
        }
      });
      A.$('#ad-export').addEventListener('click', () => {
        const head = 'Referencia;Fecha;Cliente;Servicio;Provincia;Estado;Base;IVA;Total\n';
        const rows = quotes.map((q) => [q.ref, String(q.created_at).slice(0, 10), q.client_name || '',
          q.service_name, q.province, q.status, (q.base || 0).toFixed(2), (q.vat || 0).toFixed(2), (q.total || 0).toFixed(2)]
          .join(';')).join('\n');
        A.download('vivascr-presupuestos.csv', new Blob(['﻿' + head + rows], { type:'text/csv;charset=utf-8' }));
        A.toast('CSV descargado', 'ok');
      });
    });

    const kpi = (v, l, sub, color) => `<div class="card card-p">
      <div class="small muted" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px">${l}</div>
      <div style="font-weight:800;font-size:22px;letter-spacing:-.03em;margin-top:4px;${color ? 'color:' + color : ''}">${v}</div>
      ${sub ? `<div class="small muted" style="margin-top:2px">${sub}</div>` : ''}</div>`;

    return `<div class="container" style="padding-top:18px">
      <div class="between" style="margin-bottom:14px">
        <div><div class="sec-title">Panel de administración</div>
          <div class="sec-sub">${A.esc(A.data.COMPANY.legalName)} · datos en ${A.db.mode === 'supabase' ? 'Supabase' : 'este dispositivo'}</div></div>
        <div class="row" style="gap:8px">
          ${A.store.get('nova.demo', false)
            ? '<button class="btn btn-ghost btn-sm" id="ad-demo-off" style="color:var(--red)">' + A.icon('trash', 15) + ' Borrar ejemplos</button>'
            : '<button class="btn btn-ghost btn-sm" id="ad-demo-on">' + A.icon('sparkles', 15) + ' Cargar datos de ejemplo</button>'}
          <button class="btn btn-ghost btn-sm" id="ad-export">${A.icon('download', 15)} Exportar CSV</button>
        </div>
      </div>

      <div class="grid g4">
        ${kpi(A.eur(revenue), 'Contratado', won.length + ' obras', 'var(--green)')}
        ${kpi(A.eur(collected), 'Cobrado', pays.length + ' pagos')}
        ${kpi(A.num(conv, 0) + ' %', 'Conversión', quotes.length + ' presupuestos')}
        ${kpi(A.eur(avg), 'Ticket medio', 'por presupuesto')}
        ${kpi(String(pipeline.length), 'En pipeline', A.eur(pipeline.reduce((s, q) => s + q.total, 0)), 'var(--accent)')}
        ${kpi(String(users.length), 'Clientes', 'registrados')}
        ${kpi(String(apps.filter((a) => a.status !== 'cancelada').length), 'Citas activas', 'visitas y obra')}
        ${kpi(String(vals.length), 'Avalúos', 'informes emitidos')}
      </div>

      <div class="grid g2" style="gap:12px;margin-top:14px">
        <div class="card card-p">
          <strong style="font-size:15px">Volumen presupuestado (6 meses)</strong>
          <div style="margin-top:14px">${barChart(months)}</div>
        </div>
        <div class="card card-p">
          <strong style="font-size:15px">Reparto por área</strong>
          <div class="row" style="gap:16px;margin-top:12px;align-items:center">
            ${donut(byCat)}
            <div style="flex:1;min-width:0">
              ${byCat.map((c) => `<div class="between small" style="padding:3px 0">
                <span class="row" style="gap:7px"><span style="width:10px;height:10px;border-radius:3px;background:${c.c}"></span>
                ${A.esc(c.l)}</span><strong>${c.v}</strong></div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="sec-head"><div class="sec-title">Presupuestos</div>
        <div class="sec-sub">${quotes.length} registros</div></div>
      ${!quotes.length ? `<div class="empty" style="padding:34px 20px">${A.icon('file-text', 38)}
        <h3>Todavía no hay presupuestos</h3>
        <p class="small">Aparecerán aquí en cuanto un cliente calcule uno desde la app.</p></div>` : ''}
      <div class="tablewrap" ${!quotes.length ? 'style="display:none"' : ''}>
        <table><thead><tr>
          <th>Referencia</th><th>Fecha</th><th>Cliente</th><th>Servicio</th><th>Provincia</th><th>Total</th><th>Estado</th>
        </tr></thead><tbody>
          ${quotes.map((q) => `<tr>
            <td class="mono">${A.esc(q.ref)}</td>
            <td class="muted">${A.dateFmt(q.created_at)}</td>
            <td>${A.esc(q.client_name || '—')}</td>
            <td>${A.esc(q.service_name)}</td>
            <td class="muted">${A.esc(q.province)}</td>
            <td style="font-weight:700">${A.eur(q.total)}</td>
            <td><select class="select" data-st="${q.id}" style="height:32px;font-size:12.5px;padding:0 26px 0 8px">
              ${Object.keys(STATUS_L).map((k) => `<option value="${k}" ${q.status === k ? 'selected' : ''}>${STATUS_L[k]}</option>`).join('')}
            </select></td></tr>`).join('')}
        </tbody></table>
      </div>

      <div class="grid g2" style="gap:12px;margin-top:16px">
        <div class="card card-p">
          <strong style="font-size:15px">Agenda</strong>
          <div style="margin-top:10px">
            ${apps.length ? apps.slice(0, 6).map((a) => `<div class="line">
              <span><strong class="small">${A.esc(a.title)}</strong><br>
                <span class="small muted">${A.dateFmt(a.date)} · ${A.esc(a.time)} · ${A.esc(a.address || '')}</span></span>
              <span class="badge ${a.status === 'confirmada' ? 'badge-green' : a.status === 'cancelada' ? 'badge-red' : 'badge-amber'}">${A.esc(a.status)}</span>
            </div>`).join('') : '<p class="small muted">Sin citas registradas.</p>'}
          </div>
        </div>
        <div class="card card-p">
          <strong style="font-size:15px">Tarifas vigentes</strong>
          <p class="small muted" style="margin-top:4px">Precio base por unidad, calidad estándar.</p>
          <div style="max-height:280px;overflow:auto;margin-top:8px">
            ${A.data.SERVICES.slice(0, 14).map((s) => `<div class="line">
              <span class="small">${A.esc(s.name)}</span>
              <span class="small">${A.eur(s.base, 2)} / ${A.esc(s.unit)}</span></div>`).join('')}
          </div>
          <p class="small muted" style="margin-top:8px">Edita las tarifas en <code>js/data/services.js</code> o en la tabla <code>services</code> de Supabase.</p>
        </div>
      </div>

      <div class="sec-head"><div class="sec-title">Clientes</div></div>
      <div class="tablewrap">
        <table><thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Provincia</th><th>Rol</th><th>Alta</th></tr></thead>
        <tbody>${users.map((u) => `<tr>
          <td style="font-weight:600">${A.esc(u.name)}</td><td class="muted">${A.esc(u.email)}</td>
          <td class="muted">${A.esc(u.phone || '—')}</td><td>${A.esc(u.province || '—')}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-amber' : 'badge-grey'}">${A.esc(u.role)}</span></td>
          <td class="muted">${A.dateFmt(u.created_at)}</td></tr>`).join('')}</tbody></table>
      </div>
      <div style="height:26px"></div>
    </div>`;
  }, { title:'Administración', admin:true });
})(window.App);

</script>



<script>
  window.App.boot();
</script>
</body>
</html>
