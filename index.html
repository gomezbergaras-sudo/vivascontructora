<style>
/* ============================================================
   VIVAS CR — Sistema de diseño
   Derivado del logotipo: cian #01C3FD · azul #0076D9 · blanco
   ============================================================ */

:root {
  /* Marca */
  --brand-cyan:#01C3FD; --brand-cyan-d:#00A6DB; --brand-cyan-l:#63DBFF;
  --brand-blue:#0076D9; --brand-blue-d:#0060B4;
  --navy-900:#04223C; --navy-800:#063C6B; --navy-700:#0A4F8F; --navy-600:#0D62B0;
  --navy-500:#0076D9; --navy-400:#3D9BEA; --navy-300:#8FC8F4;
  --steel-900:#1E293B; --steel-700:#334155; --steel-600:#475569; --steel-500:#64748B;
  --steel-400:#94A3B8; --steel-300:#CBD5E1; --steel-200:#E2E8F0; --steel-100:#F1F5F9;
  --steel-50:#F8FAFC;
  --amber:#E8A33D; --amber-dark:#B87B14; --amber-soft:#FDF3E2;
  --green:#12A06B; --green-soft:#E3F6EE;
  --red:#D14343; --red-soft:#FCECEC;

  /* Tokens semánticos — CLARO */
  --bg:#F2F6FA;
  --bg-elev:#FFFFFF;
  --bg-sunken:#E7EFF7;
  --surface:#FFFFFF;
  --surface-2:#F6FAFD;
  --border:#DDE7F0;
  --border-strong:#C2D4E4;
  --text:#08243D;
  --text-2:#42607A;
  --text-3:#7592AB;
  --primary:#063C6B;
  --primary-ink:#FFFFFF;
  --primary-soft:#E2F0FB;
  --accent:#0092C9;          /* cian del logo, ajustado para contraste sobre blanco */
  --accent-ink:#FFFFFF;
  --accent-soft:#DEF5FE;
  --ring:rgba(6,60,107,.26);
  --shadow-sm:0 1px 2px rgba(6,60,107,.06), 0 1px 3px rgba(6,60,107,.05);
  --shadow:0 4px 12px rgba(6,60,107,.09), 0 1px 3px rgba(6,60,107,.05);
  --shadow-lg:0 18px 45px rgba(6,60,107,.18), 0 4px 12px rgba(6,60,107,.08);
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
  --nav-h:64px; --bottom-h:66px;
  --font:'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --serif:'Georgia', 'Times New Roman', serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#05131F;
    --bg-elev:#0A1F32;
    --bg-sunken:#030D17;
    --surface:#0A1F32;
    --surface-2:#102C44;
    --border:#1B3A55;
    --border-strong:#2B5273;
    --text:#E4F1FA;
    --text-2:#9FBCD2;
    --text-3:#6C8CA5;
    --primary:#3D9BEA;
    --primary-ink:#02121F;
    --primary-soft:#0F2E4A;
    --accent:#01C3FD;
    --accent-ink:#02202C;
    --accent-soft:#0B3244;
    --ring:rgba(61,155,234,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 20px 50px rgba(0,0,0,.6);
    --amber-soft:#2B2312;
    --green-soft:#07291C;
    --red-soft:#2C1414;
  }
}

:root[data-theme="dark"] {
  --bg:#05131F; --bg-elev:#0A1F32; --bg-sunken:#030D17;
  --surface:#0A1F32; --surface-2:#102C44;
  --border:#1B3A55; --border-strong:#2B5273;
  --text:#E4F1FA; --text-2:#9FBCD2; --text-3:#6C8CA5;
  --primary:#3D9BEA; --primary-ink:#02121F; --primary-soft:#0F2E4A;
  --accent:#01C3FD; --accent-ink:#02202C; --accent-soft:#0B3244;
  --ring:rgba(61,155,234,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
  --amber-soft:#2B2312; --green-soft:#07291C; --red-soft:#2C1414;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
img { max-width:100%; display:block; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { margin:0; line-height:1.2; font-weight:700; letter-spacing:-.02em; }
p { margin:0; }
ul { margin:0; padding:0; list-style:none; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }

/* ---------- Layout ---------- */
#app { min-height:100%; display:flex; flex-direction:column; }
.shell { display:flex; flex:1; min-height:0; }
.main { flex:1; min-width:0; padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px) + 16px); }
.container { width:100%; max-width:1180px; margin:0 auto; padding:0 16px; }
.view { animation:fade .28s ease both; }
@keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

/* ---------- Top bar ---------- */
.topbar {
  position:sticky; top:0; z-index:60; height:var(--nav-h);
  background:color-mix(in srgb, var(--bg-elev) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-inner { height:100%; display:flex; align-items:center; gap:12px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.03em; font-size:17px; }
.brand-mark { width:36px; height:36px; flex:none; display:block; }
.brand-mark img { width:100%; height:100%; object-fit:contain; }
.brand-name { font-family:var(--serif); font-size:19px; font-weight:400; letter-spacing:0; color:var(--primary); line-height:1; }
.brand small { display:none; font-size:9.5px; font-weight:700; letter-spacing:.15em; color:var(--text-3);
  text-transform:uppercase; white-space:nowrap; line-height:1.4; }
@media (min-width:560px){ .brand small { display:block; } }
.brand > span { min-width:0; }
.topbar-actions { margin-left:auto; display:flex; align-items:center; gap:6px; }
.iconbtn {
  width:38px; height:38px; border-radius:11px; border:1px solid transparent; background:transparent;
  display:grid; place-items:center; cursor:pointer; color:var(--text-2); position:relative;
  transition:background .15s, color .15s;
}
.iconbtn:hover { background:var(--surface-2); color:var(--text); }
.iconbtn .dot { position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--red); border:2px solid var(--bg-elev); }
.lang-toggle { border:1px solid var(--border); border-radius:11px; height:38px; padding:0 10px; background:transparent; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--text-2); }

/* ---------- Desktop nav ---------- */
.desknav { display:none; gap:2px; margin-left:14px; }
.desknav a {
  padding:8px 12px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--text-2);
  white-space:nowrap; transition:background .15s, color .15s;
}
.desknav a:hover { background:var(--surface-2); color:var(--text); }
.desknav a.active { background:var(--primary-soft); color:var(--primary); }
@media (min-width:960px){ .desknav{ display:flex; } }

/* ===== js/engine.js ===== */
/* ============================================================
   engine.js — Motores de cálculo
   · quoteEngine  : presupuestos de obra y servicios
   · valuationEngine : avalúo de inmuebles
   Todos los importes en euros, base imponible salvo indicación.
   ============================================================ */
(function (A) {
  'use strict';

  const IVA_GENERAL = 0.21;
  const IVA_REFORMA = 0.10;   // Reforma de vivienda con > 2 años de antigüedad
  const IVA_OBRA_NUEVA = 0.10;

  /* Servicios que pueden acogerse al IVA reducido del 10 % */
  const REDUCED_VAT_CATS = ['fontaneria', 'electricidad', 'reformas', 'climatizacion', 'adicionales'];

  /**
   * Calcula un presupuesto completo.
   * @param {object} input
   *  { serviceId, qty, quality, province, urgency, extras:[ids], vivienda2anios:boolean,
   *    materialsFromCart:[{name,price,qty}] , discountPct }
   */
  function quote(input) {
    const svc = A.data.service(input.serviceId);
    if (!svc) return null;

    const qual = A.data.QUALITIES.find((q) => q.id === input.quality) || A.data.QUALITIES[1];
    const urg = A.data.URGENCY.find((u) => u.id === input.urgency) || A.data.URGENCY[0];
    const regionF = A.data.REGION_FACTOR[input.province] != null ? A.data.REGION_FACTOR[input.province] : 1;

    const qty = A.clamp(Number(input.qty) || svc.qty.def, svc.qty.min, svc.qty.max);

    /* --- Partidas --- */
    const lines = [];

    // 1. Trabajo principal
    const unitPrice = svc.base * qual.factor * regionF;
    const mainAmount = unitPrice * qty;
    lines.push({
      code:'01', concept:`${svc.name} — ${qual.name}`,
      detail:`${A.num(qty, qty % 1 ? 1 : 0)} ${svc.unitName} × ${A.eur(unitPrice, 2)}`,
      qty, unit:svc.unit, unitPrice, amount:mainAmount, group:'principal'
    });

    // 2. Puesta en obra / desplazamiento
    const setup = svc.fixed * regionF;
    if (setup > 0) {
      lines.push({
        code:'02', concept:'Puesta en obra, medios auxiliares y protección',
        detail:'Desplazamiento, protecciones, andamiaje ligero y retirada de residuos a gestor autorizado',
        qty:1, unit:'partida', unitPrice:setup, amount:setup, group:'principal'
      });
    }

    // 3. Extras seleccionados
    const chosen = (input.extras || []);
    let n = 3;
    (svc.extras || []).forEach((ex) => {
      if (chosen.indexOf(ex.id) === -1) return;
      const q = ex.type === 'unit' ? qty : 1;
      const p = ex.price * regionF * (ex.type === 'unit' ? 1 : 1);
      lines.push({
        code:String(n++).padStart(2, '0'), concept:ex.name,
        detail: ex.type === 'unit' ? `${A.num(q)} × ${A.eur(p, 2)}` : 'Partida alzada',
        qty:q, unit: ex.type === 'unit' ? svc.unit : 'partida',
        unitPrice:p, amount:p * q, group:'extras'
      });
    });

    // 4. Materiales añadidos desde el comparador
    (input.materials || []).forEach((m) => {
      const amt = (m.price / 1.21) * (m.qty || 1); // los PVP del comparador incluyen IVA
      lines.push({
        code:String(n++).padStart(2, '0'), concept:`Material: ${m.name}`,
        detail:`${m.qty || 1} × ${A.eur(m.price / 1.21, 2)} (${m.store || 'proveedor'})`,
        qty:m.qty || 1, unit:'ud', unitPrice:m.price / 1.21, amount:amt, group:'materiales'
      });
    });

    /* --- Totales --- */
    let subtotal = lines.reduce((s, l) => s + l.amount, 0);

    // Urgencia
    const urgencyAmount = subtotal * (urg.factor - 1);
    if (urgencyAmount > 0) {
      lines.push({
        code:'99A', concept:`Recargo por ${urg.name.toLowerCase()}`, detail:`+${Math.round((urg.factor - 1) * 100)} % sobre base`,
        qty:1, unit:'partida', unitPrice:urgencyAmount, amount:urgencyAmount, group:'ajustes'
      });
      subtotal += urgencyAmount;
    }

    // Mínimo facturable
    let minApplied = false;
    if (subtotal < svc.minTotal) { subtotal = svc.minTotal; minApplied = true; }

    // Descuento comercial
    const discPct = A.clamp(Number(input.discountPct) || 0, 0, 30);
    const discount = subtotal * (discPct / 100);
    const base = subtotal - discount;

    // IVA
    const reduced = input.vivienda2anios !== false && REDUCED_VAT_CATS.indexOf(svc.cat) !== -1;
    const vatRate = svc.cat === 'construccion'
      ? (input.obraNueva ? IVA_OBRA_NUEVA : IVA_GENERAL)
      : (reduced ? IVA_REFORMA : IVA_GENERAL);
    const vat = base * vatRate;
    const total = base + vat;

    /* --- Plazo --- */
    const rawDays = svc.days[0] + svc.days[1] * qty;
    const days = Math.max(1, Math.round(rawDays / (urg.id === 'urgente' ? 1.4 : urg.id === 'preferente' ? 1.15 : 1)));

    /* --- Plan de pagos --- */
    const payments = [
      { label:'Firma del contrato (acopio de material)', pct:0.40, amount:total * 0.40 },
      { label:'Certificación de avance al 50 %', pct:0.35, amount:total * 0.35 },
      { label:'Certificación al 90 %', pct:0.15, amount:total * 0.15 },
      { label:'Entrega y revisión final', pct:0.10, amount:total * 0.10 }
    ];

    /* --- Rango de confianza --- */
    const spread = svc.cat === 'construccion' ? 0.12 : 0.08;

    return {
      service:svc, quality:qual, urgency:urg, province:input.province, regionFactor:regionF,
      qty, lines, subtotal, discount, discountPct:discPct, base, vatRate, vat, total,
      minApplied, days, payments,
      rangeLow: total * (1 - spread), rangeHigh: total * (1 + spread),
      includes: svc.includes || [],
      pricePerUnit: qty ? total / qty : total
    };
  }

  /**
   * Avalúo de inmueble.
   * @param {object} i
   *  { province, areaType, propertyType, m2, rooms, baths, year, condition,
   *    energy, improvements:[ids], drawbacks:[ids], floor, hasLift }
   */
  function valuation(i) {
    const z = A.data.zone(i.province);
    const area = A.data.AREA_TYPE.find((a) => a.id === i.areaType) || A.data.AREA_TYPE[2];
    const type = A.data.PROPERTY_TYPE.find((p) => p.id === i.propertyType) || A.data.PROPERTY_TYPE[0];
    const cond = A.data.CONDITION.find((c) => c.id === i.condition) || A.data.CONDITION[2];
    const m2 = Math.max(15, Number(i.m2) || 80);
    const age = Math.max(0, new Date().getFullYear() - (Number(i.year) || 1990));
    const ageF = A.data.ageFactor(age);

    /* Valor unitario */
    const unitBase = z.base;
    let unit = unitBase * area.factor * type.factor * cond.factor * ageF;

    /* Certificación energética */
    const eIdx = A.data.ENERGY.indexOf(i.energy || 'D');
    const energyF = 1 + (3 - eIdx) * 0.012;   // A ≈ +3,6 % · G ≈ −4,8 %
    unit *= energyF;

    /* Distribución: penaliza viviendas con pocas piezas para su superficie */
    const rooms = Number(i.rooms) || 3;
    const idealRooms = A.clamp(Math.round(m2 / 28), 1, 6);
    const distF = 1 - Math.min(0.05, Math.abs(rooms - idealRooms) * 0.015);
    unit *= distF;

    let gross = unit * m2;

    /* Mejoras */
    const impDetail = [];
    (i.improvements || []).forEach((id) => {
      const im = A.data.IMPROVEMENTS.find((x) => x.id === id);
      if (!im) return;
      const amount = im.type === 'pct' ? gross * im.value : im.value;
      impDetail.push({ name:im.name, amount });
    });
    const impTotal = impDetail.reduce((s, x) => s + x.amount, 0);

    /* Penalizaciones */
    const drwDetail = [];
    (i.drawbacks || []).forEach((id) => {
      const d = A.data.DRAWBACKS.find((x) => x.id === id);
      if (!d) return;
      drwDetail.push({ name:d.name, amount: gross * d.value });
    });
    const drwTotal = drwDetail.reduce((s, x) => s + x.amount, 0);

    const value = Math.max(gross * 0.35, gross + impTotal + drwTotal);

    /* Mercado comparable (misma zona) */
    const comparables = [];
    for (let k = 0; k < 5; k++) {
      const seed = (i.province || '') + i.areaType + k + m2;
      const dm = Math.round(m2 * (0.82 + (A.hash(seed) % 40) / 100));
      const du = unit * (0.88 + (A.hash(seed + 'u') % 26) / 100);
      comparables.push({
        ref:'C-' + String(A.hash(seed) % 9000 + 1000),
        m2:dm, unit:du, price:du * dm,
        rooms: A.clamp(Math.round(dm / 28), 1, 6),
        cond: A.data.CONDITION[A.hash(seed + 'c') % A.data.CONDITION.length].name,
        days: 20 + (A.hash(seed + 'd') % 160)
      });
    }
    const marketAvgUnit = comparables.reduce((s, c) => s + c.unit, 0) / comparables.length;

    /* Alquiler estimado y rentabilidad */
    const monthlyRent = (value * (z.rentYield / 100)) / 12;

    /* Potencial tras reforma */
    const reformUnit = unitBase * area.factor * type.factor * 1.10 * A.data.ageFactor(Math.min(age, 15)) * energyF * distF;
    const potential = reformUnit * m2 + impTotal;
    const reformCost = m2 * (cond.id === 'ruina' ? 980 : cond.id === 'reformar' ? 760 : cond.id === 'aceptable' ? 420 : 180);
    const upside = potential - value - reformCost;

    /* Impuestos y gastos de compraventa (orientativo) */
    const itp = value * 0.07;
    const notary = A.clamp(value * 0.004, 600, 1800);
    const registry = A.clamp(value * 0.002, 400, 900);
    const agency = 400;

    return {
      zone:z, area, type, cond, m2, age, ageFactor:ageF, energyFactor:energyF, distFactor:distF,
      unitBase, unit, gross,
      improvements:impDetail, improvementsTotal:impTotal,
      drawbacks:drwDetail, drawbacksTotal:drwTotal,
      value, low: value * 0.93, high: value * 1.07,
      comparables, marketAvgUnit,
      monthlyRent, grossYield:z.rentYield, trend:z.trend,
      potential, reformCost, upside,
      costs:{ itp, notary, registry, agency, total: itp + notary + registry + agency },
      liquidity: Math.round(35 + (A.hash((i.province||'')+i.condition) % 120))
    };
  }

  A.engine = { quote, valuation, IVA_GENERAL, IVA_REFORMA };
})(window.App);

/* ===== js/db.js ===== */
/* ============================================================
   db.js — Capa de datos con dos adaptadores
   · LocalAdapter    : IndexedDB/localStorage (funciona sin backend)
   · SupabaseAdapter : Postgres + Auth + Storage + Realtime
   Cambia de uno a otro en config.js sin tocar el resto de la app.
   ============================================================ */
(function (A) {
  'use strict';

  const KEY = 'nova.db.v1';

  /* ---------------- Adaptador local ---------------- */
  const LocalAdapter = {
    name:'local',
    _load() {
      return A.store.get(KEY, { users:[], quotes:[], valuations:[], appointments:[],
        messages:[], notifications:[], renders:[], payments:[], searches:[], favorites:[] });
    },
    _save(db) { A.store.set(KEY, db); },

    async list(table, filter) {
      const db = this._load();
      let rows = (db[table] || []).slice();
      if (filter) rows = rows.filter((r) => Object.keys(filter).every((k) => r[k] === filter[k]));
      return rows.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
    },
    async get(table, id) {
      const db = this._load();
      return (db[table] || []).find((r) => r.id === id) || null;
    },
    async insert(table, row) {
      const db = this._load();
      db[table] = db[table] || [];
      const rec = Object.assign({ id: A.uid(table.slice(0, 3)), created_at: new Date().toISOString() }, row);
      db[table].unshift(rec);
      this._save(db);
      return rec;
    },
    async update(table, id, patch) {
      const db = this._load();
      const i = (db[table] || []).findIndex((r) => r.id === id);
      if (i === -1) return null;
      db[table][i] = Object.assign({}, db[table][i], patch, { updated_at: new Date().toISOString() });
      this._save(db);
      return db[table][i];
    },
    async remove(table, id) {
      const db = this._load();
      db[table] = (db[table] || []).filter((r) => r.id !== id);
      this._save(db);
      return true;
    },
    async count(table, filter) { return (await this.list(table, filter)).length; }
  };

  /* ---------------- Adaptador Supabase ----------------
     Requiere cargar antes el SDK oficial de Supabase (una etiqueta script
     apuntando a https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)
     y las claves en A.config.supabase. El esquema SQL está en
     /supabase/schema.sql (con políticas RLS por usuario).
     ---------------------------------------------------- */
  /* La app habla de "users"; en Postgres la tabla es "profiles",
     porque las credenciales las gestiona Supabase Auth. */
  const TABLE_ALIAS = { users:'profiles' };
  const real = (t) => TABLE_ALIAS[t] || t;

  const SupabaseAdapter = {
    name:'supabase',
    client:null,
    init(url, anonKey) {
      if (!window.supabase) { console.warn('[NOVA] SDK de Supabase no cargado; se usa el adaptador local.'); return false; }
      this.client = window.supabase.createClient(url, anonKey);
      return true;
    },
    async list(table, filter) {
      let q = this.client.from(real(table)).select('*').order('created_at', { ascending:false });
      if (filter) Object.keys(filter).forEach((k) => { q = q.eq(k, filter[k]); });
      const { data, error } = await q;
      if (error) throw error;
      return data;
    },
    async get(table, id) {
      const { data, error } = await this.client.from(real(table)).select('*').eq('id', id).single();
      if (error) return null;
      return data;
    },
    async insert(table, row) {
      const { data, error } = await this.client.from(real(table)).insert(row).select().single();
      if (error) throw error;
      return data;
    },
    async update(table, id, patch) {
      const { data, error } = await this.client.from(real(table)).update(patch).eq('id', id).select().single();
      if (error) throw error;
      return data;
    },
    async remove(table, id) {
      const { error } = await this.client.from(real(table)).delete().eq('id', id);
      if (error) throw error;
      return true;
    },
    async count(table, filter) {
      let q = this.client.from(real(table)).select('id', { count:'exact', head:true });
      if (filter) Object.keys(filter).forEach((k) => { q = q.eq(k, filter[k]); });
      const { count } = await q;
      return count || 0;
    },
    /** Suscripción en tiempo real (mensajería, estado de obra). */
    subscribe(table, cb) {
      return this.client.channel('rt-' + real(table))
        .on('postgres_changes', { event:'*', schema:'public', table: real(table) }, (p) => cb(p))
        .subscribe();
    }
  };

  /* ---------------- Selección de adaptador ---------------- */
  let active = LocalAdapter;

  function useSupabase(url, key) {
    if (SupabaseAdapter.init(url, key)) { active = SupabaseAdapter; return true; }
    return false;
  }

  A.db = {
    get adapter() { return active; },
    get client() { return active.client || null; },
    get mode() { return active.name; },
    useSupabase,
    useLocal() { active = LocalAdapter; },
    list:(t, f) => active.list(t, f),
    get:(t, id) => active.get(t, id),
    insert:(t, r) => active.insert(t, r),
    update:(t, id, p) => active.update(t, id, p),
    remove:(t, id) => active.remove(t, id),
    count:(t, f) => active.count(t, f),
    subscribe:(t, cb) => (active.subscribe ? active.subscribe(t, cb) : null),
    /** Exporta todos los datos locales (respaldo del cliente / RGPD). */
    exportAll() { return A.store.get(KEY, {}); },
    importAll(obj) { A.store.set(KEY, obj); },
    wipe() { A.store.del(KEY); }
  };
})(window.App);

/* ===== js/state.js ===== */
/* ============================================================
   state.js — Sesión, usuario y estado global de la aplicación
   ============================================================ */
(function (A) {
  'use strict';

  const SKEY = 'nova.session';
  const PKEY = 'nova.prefs';

  const listeners = [];
  const emit = (evt) => listeners.forEach((f) => { try { f(evt); } catch (e) { console.error(e); } });

  const S = {
    user: A.store.get(SKEY, null),
    prefs: A.store.get(PKEY, { theme:'auto', lang:'es', push:true, email:true, whatsapp:true, consent:false }),
    cart: A.store.get('nova.cart', []),          // materiales añadidos al presupuesto
    searches: A.store.get('nova.searches', []),  // historial de búsqueda
    draft: A.store.get('nova.draft', null),      // borrador del cotizador
    unread: 0
  };

  /* ---------------- Autenticación ----------------
     Modo local: hash simple con salt (suficiente para la demo, pero el
     backend real usa Supabase Auth con bcrypt + JWT y verificación de correo). */
  async function digest(text) {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    return 'plain:' + A.hash(text);
  }

  async function register(data) {
    const users = await A.db.list('users');
    if (users.some((u) => u.email.toLowerCase() === data.email.toLowerCase())) {
      throw new Error('Ya existe una cuenta con ese correo.');
    }
    const rec = await A.db.insert('users', {
      name: data.name, email: data.email.toLowerCase(), phone: data.phone || '',
      province: data.province || 'Madrid', pass: await digest(data.password + '·nova'),
      role: data.role || 'cliente', consent: !!data.consent, consent_version: A.config.gdpr.consentVersion
    });
    setUser(rec);
    await notify('¡Bienvenido a Vivas CR!', 'Tu cuenta está lista. Ya puedes calcular presupuestos, guardarlos y pedir tu visita técnica gratuita.', 'check-circle');
    return rec;
  }

  async function login(email, password) {
    const users = await A.db.list('users');
    const u = users.find((x) => x.email.toLowerCase() === String(email).toLowerCase());
    if (!u) throw new Error('No encontramos ninguna cuenta con ese correo.');
    if (u.pass !== await digest(password + '·nova')) throw new Error('La contraseña no es correcta.');
    setUser(u);
    return u;
  }

  function setUser(u) {
    S.user = u ? { id:u.id, name:u.name, email:u.email, phone:u.phone, province:u.province, role:u.role } : null;
    A.store.set(SKEY, S.user);
    emit({ type:'auth' });
  }
  function logout() { setUser(null); emit({ type:'auth' }); }
  const isAdmin = () => !!(S.user && S.user.role === 'admin');

  /* ---------------- Preferencias ---------------- */
  function setPref(k, v) {
    S.prefs[k] = v; A.store.set(PKEY, S.prefs);
    if (k === 'theme') applyTheme();
    emit({ type:'prefs', key:k });
  }
  function applyTheme() {
    const t = S.prefs.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  /* ---------------- Carrito de materiales ---------------- */
  function cartAdd(item) {
    const i = S.cart.findIndex((x) => x.id === item.id && x.store === item.store);
    if (i >= 0) S.cart[i].qty += (item.qty || 1);
    else S.cart.push(Object.assign({ qty:1 }, item));
    A.store.set('nova.cart', S.cart); emit({ type:'cart' });
  }
  function cartRemove(idx) { S.cart.splice(idx, 1); A.store.set('nova.cart', S.cart); emit({ type:'cart' }); }
  function cartQty(idx, q) { S.cart[idx].qty = Math.max(1, q); A.store.set('nova.cart', S.cart); emit({ type:'cart' }); }
  function cartClear() { S.cart = []; A.store.set('nova.cart', S.cart); emit({ type:'cart' }); }
  const cartTotal = () => S.cart.reduce((s, x) => s + x.price * x.qty, 0);

  /* ---------------- Historial de búsqueda ---------------- */
  function addSearch(q) {
    if (!q || !q.trim()) return;
    S.searches = [q.trim()].concat(S.searches.filter((x) => x !== q.trim())).slice(0, 12);
    A.store.set('nova.searches', S.searches);
  }
  function clearSearches() { S.searches = []; A.store.set('nova.searches', []); }

  /* ---------------- Notificaciones ---------------- */
  async function notify(title, body, icon, link) {
    const rec = await A.db.insert('notifications', {
      user_id: S.user ? S.user.id : 'anon', title, body, icon: icon || 'bell', link: link || '', read:false
    });
    emit({ type:'notify' });
    if (S.prefs.push && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body, tag: rec.id }); } catch (e) {}
    }
    return rec;
  }
  async function askPush() {
    if (!('Notification' in window)) { A.toast('Este dispositivo no admite notificaciones', 'err'); return false; }
    const p = await Notification.requestPermission();
    setPref('push', p === 'granted');
    A.toast(p === 'granted' ? 'Notificaciones activadas' : 'Notificaciones bloqueadas', p === 'granted' ? 'ok' : 'err');
    return p === 'granted';
  }
  async function unreadCount() {
    const list = await A.db.list('notifications', S.user ? { user_id:S.user.id } : null);
    return list.filter((n) => !n.read).length;
  }

  /* ---------------- Borrador del cotizador ---------------- */
  function saveDraft(d) { S.draft = d; A.store.set('nova.draft', d); }
  function clearDraft() { S.draft = null; A.store.del('nova.draft'); }

  /* ---------------- Puesta en marcha ----------------
     Crea la cuenta de administración la primera vez. No se inventa
     ningún historial: las obras, reseñas y presupuestos son los que
     tú vayas dando de alta. */
  async function seed() {
    if (A.store.get('nova.seeded', false)) return;
    await A.db.insert('users', {
      name:'Vivas CR', email:'admin@vivascr.es', phone:A.data.COMPANY.phone,
      province:'Tarragona', role:'admin', pass: await digest('vivas2026·nova'), consent:true
    });
    A.store.set('nova.seeded', true);
  }

  /* ---------------- Datos de ejemplo (opcional) ----------------
     Solo para ver cómo queda el panel lleno. Se pueden borrar de
     un clic desde Administración. */
  async function loadDemo() {
    const users = await A.db.list('users');
    let cli = users.find((u) => u.email === 'cliente@ejemplo.es');
    if (!cli) {
      cli = await A.db.insert('users', { name:'Cliente de ejemplo', email:'cliente@ejemplo.es',
        phone:'+34 600 000 000', province:'Tarragona', role:'cliente',
        pass: await digest('ejemplo1234·nova'), consent:true, demo:true });
    }
    const samples = [
      { sid:'ref-bano', qty:5, q:'estandar', prov:'Tarragona', st:'aceptado', days:-38 },
      { sid:'ref-cocina', qty:11, q:'premium', prov:'Barcelona', st:'en_obra', days:-24 },
      { sid:'ele-instalacion', qty:78, q:'estandar', prov:'Tarragona', st:'enviado', days:-12 },
      { sid:'cli-aire', qty:3, q:'estandar', prov:'Tarragona', st:'aceptado', days:-7 },
      { sid:'fon-calentador', qty:1, q:'basica', prov:'Girona', st:'enviado', days:-3 },
      { sid:'ref-pintura', qty:180, q:'estandar', prov:'Tarragona', st:'borrador', days:-1 }
    ];
    let n = 1;
    for (const x of samples) {
      const calc = A.engine.quote({ serviceId:x.sid, qty:x.qty, quality:x.q, province:x.prov, urgency:'normal', extras:[] });
      await A.db.insert('quotes', {
        user_id:cli.id, ref:A.ref('PRES', n++), service_id:x.sid, service_name:calc.service.name,
        category:calc.service.cat, qty:x.qty, quality:x.q, province:x.prov, urgency:'normal', extras:[],
        base:calc.base, vat:calc.vat, total:calc.total, days:calc.days, status:x.st,
        client_name:'Cliente de ejemplo', client_email:'cliente@ejemplo.es', client_phone:'+34 600 000 000',
        demo:true, created_at:new Date(Date.now() + x.days * 864e5).toISOString()
      });
    }
    await A.db.insert('appointments', { user_id:cli.id, type:'visita', title:'Visita técnica — baño',
      date:new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10), time:'10:30',
      address:'Amposta', status:'confirmada', notes:'Medición y comprobación de bajantes.', demo:true });

  }

  async function clearDemo() {
    for (const t of ['quotes', 'appointments', 'messages', 'notifications', 'users']) {
      const rows = await A.db.list(t);
      for (const r of rows) if (r.demo) await A.db.remove(t, r.id);
    }
    A.store.set('nova.demo', false);
    return true;
  }

  /** Con Supabase, guardar requiere sesión: las políticas de seguridad
      atan cada registro a su usuario. En modo local no hace falta. */
  function requireAuth(motivo) {
    if (A.db.mode !== 'supabase' || S.user) return true;
    A.toast(motivo || 'Entra en tu cuenta para guardar esto', 'err');
    A.go('/login?next=' + encodeURIComponent(location.hash.replace(/^#/, '')));
    return false;
  }

  A.requireAuth = requireAuth;
  A.state = S;
  A.auth = { register, login, logout, setUser, isAdmin };
  A.on_ = (fn) => { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); };
  A.emit = emit;
  A.prefs = { set:setPref, applyTheme };
  A.cart = { add:cartAdd, remove:cartRemove, qty:cartQty, clear:cartClear, total:cartTotal };
  A.search = { add:addSearch, clear:clearSearches };
  A.notify = notify; A.askPush = askPush; A.unreadCount = unreadCount;
  A.draft = { save:saveDraft, clear:clearDraft };
  A.seed = seed; A.loadDemo = loadDemo; A.clearDemo = clearDemo;
})(window.App);

/* ===== js/auth-supabase.js ===== */
/* ============================================================
   auth-supabase.js — Autenticación real contra Supabase Auth
   Solo se activa cuando hay claves configuradas. En modo local
   la app sigue usando su autenticación propia del dispositivo.
   ============================================================ */
(function (A) {
  'use strict';

  /** Lee (o crea) la ficha de perfil asociada a la cuenta. */
  async function loadProfile(user) {
    const sb = A.db.client;
    let { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (error || !data) {
      /* Si el disparador de la base de datos no llegó a crearla, la creamos aquí. */
      const meta = user.user_metadata || {};
      const ins = await sb.from('profiles').insert({
        id: user.id, name: meta.name || user.email.split('@')[0], email: user.email,
        phone: meta.phone || '', province: meta.province || 'Tarragona', role: 'cliente'
      }).select().single();
      data = ins.data;
    }
    return data;
  }

  async function register(d) {
    const sb = A.db.client;
    const { data, error } = await sb.auth.signUp({
      email: d.email, password: d.password,
      options: { data: { name: d.name, phone: d.phone || '', province: d.province || 'Tarragona' } }
    });
    if (error) throw new Error(traducir(error.message));
    if (!data.session) {
      /* Supabase pide confirmar el correo antes de entrar. */
      throw new Error('Cuenta creada. Revisa tu correo y confirma la dirección para poder entrar.');
    }
    A.auth.setUser(await loadProfile(data.user));
    return A.state.user;
  }

  async function login(email, password) {
    const sb = A.db.client;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(traducir(error.message));
    A.auth.setUser(await loadProfile(data.user));
    return A.state.user;
  }

  async function logout() {
    try { await A.db.client.auth.signOut(); } catch (e) {}
    A.auth.setUser(null);
  }

  /** Recupera la sesión al abrir la app (el token se refresca solo). */
  async function restore() {
    const sb = A.db.client;
    if (!sb) return null;
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      try { A.auth.setUser(await loadProfile(data.session.user)); } catch (e) {}
    } else {
      A.auth.setUser(null);
    }
    sb.auth.onAuthStateChange(async (evt, session) => {
      if (evt === 'SIGNED_OUT') A.auth.setUser(null);
      else if (session && (!A.state.user || A.state.user.id !== session.user.id)) {
        try { A.auth.setUser(await loadProfile(session.user)); } catch (e) {}
      }
    });
    return A.state.user;
  }

  /** Mensajes de error de Supabase en castellano. */
  function traducir(msg) {
    const m = String(msg || '').toLowerCase();
    if (m.indexOf('invalid login credentials') !== -1) return 'El correo o la contraseña no son correctos.';
    if (m.indexOf('user already registered') !== -1) return 'Ya existe una cuenta con ese correo.';
    if (m.indexOf('email not confirmed') !== -1) return 'Tienes que confirmar tu correo antes de entrar. Mira tu bandeja de entrada.';
    if (m.indexOf('password should be') !== -1) return 'La contraseña es demasiado corta: mínimo 6 caracteres.';
    if (m.indexOf('rate limit') !== -1) return 'Demasiados intentos. Espera un minuto y vuelve a probar.';
    return msg;
  }

  /** Sustituye la autenticación local por la de Supabase. */
  function install() {
    A.auth.register = register;
    A.auth.login = login;
    A.auth.logout = logout;
  }

  A.authSupabase = { install, restore, loadProfile };
})(window.App);

/* ============================================================
   pdf.js — Generador de PDF propio (sin dependencias)
   Escribe PDF 1.4 con fuentes base Helvetica y codificación
   WinAnsi, suficiente para presupuestos e informes en español.

    0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
    0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B, 0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F };

/* ============================================================
   api/materials-api.js — Búsqueda y comparación de materiales
   Si config.integrations.materialsApi tiene endpoint + apiKey, la
   función search() llama al servicio real. Sin claves, resuelve con
   el simulador local sobre el catálogo de data/materials.js.
   ============================================================ */
(function (A) {
  'use strict';

  /* Diferencial de precio por tienda (margen, promociones y logística) */
  const STORE_BIAS = { leroy:1.00, brico:0.88, bauhaus:1.04, amazon:0.96, ferre:1.09 };

  /** Genera la oferta de cada tienda para un producto, de forma estable. */
  function offersFor(p) {
    return A.data.STORES.map((st) => {
      const seed = p.id + st.id;
      const jitter = 0.92 + (A.hash(seed) % 17) / 100;          // ±8 %
      const price = Math.round(p.base * STORE_BIAS[st.id] * jitter * 100) / 100;
      const promo = (A.hash(seed + 'promo') % 100) < 22;          // ~22 % con oferta
      const discount = promo ? 5 + (A.hash(seed + 'd') % 21) : 0; // 5-25 %
      const final = Math.round(price * (1 - discount / 100) * 100) / 100;
      const stockN = A.hash(seed + 's') % 100;
      return {
        store: st.id, storeName: st.name, color: st.color, short: st.short,
        price: final, listPrice: price, discount,
        stock: stockN > 12 ? (stockN > 45 ? 'disponible' : 'pocas unidades') : 'sin stock',
        units: stockN > 12 ? 3 + (stockN % 90) : 0,
        delivery: st.ship,
        url: '#/materiales/' + p.id,
        rating: 3.6 + (A.hash(seed + 'r') % 14) / 10
      };
    }).sort((a, b) => a.price - b.price);
  }

  /** Enriquece un producto con sus ofertas y métricas. */
  function enrich(p) {
    const offers = offersFor(p);
    const inStock = offers.filter((o) => o.stock !== 'sin stock');
    const best = inStock[0] || offers[0];
    const worst = offers[offers.length - 1];
    return Object.assign({}, p, {
      offers, best, worst,
      spread: worst.price - best.price,
      spreadPct: worst.price ? ((worst.price - best.price) / worst.price) * 100 : 0,
      hasPromo: offers.some((o) => o.discount > 0),
      img: A.artwork(p.id, p.brand, p.unit)
    });
  }

  /** Búsqueda con filtros. */
  async function search(opts) {
    opts = opts || {};
    if (A.hasKey('integrations.materialsApi.apiKey') && A.hasKey('integrations.materialsApi.endpoint')) {
      /* --- Ruta real: sustituye por tu proveedor de precios --- */
      const url = new URL(A.config.integrations.materialsApi.endpoint);
      url.searchParams.set('q', opts.q || '');
      url.searchParams.set('cat', opts.cat || '');
      const res = await fetch(url, { headers:{ Authorization:'Bearer ' + A.config.integrations.materialsApi.apiKey } });
      if (!res.ok) throw new Error('Servicio de precios no disponible');
      return (await res.json()).items.map(enrich);
    }

    /* --- Simulador local --- */
    await A.sleep(260 + Math.random() * 320);   // latencia realista
    const q = (opts.q || '').toLowerCase().trim();
    let rows = A.data.PRODUCTS.filter((p) => {
      if (opts.cat && p.cat !== opts.cat) return false;
      if (!q) return true;
      return (p.name + ' ' + p.brand + ' ' + p.ref).toLowerCase().indexOf(q) !== -1;
    }).map(enrich);

    if (opts.min != null) rows = rows.filter((r) => r.best.price >= opts.min);
    if (opts.max != null) rows = rows.filter((r) => r.best.price <= opts.max);
    if (opts.onlyStock) rows = rows.filter((r) => r.best.stock !== 'sin stock');
    if (opts.onlyPromo) rows = rows.filter((r) => r.hasPromo);
    if (opts.store) rows = rows.filter((r) => r.offers.some((o) => o.store === opts.store && o.stock !== 'sin stock'));

    const sort = opts.sort || 'relevancia';
    if (sort === 'precio_asc') rows.sort((a, b) => a.best.price - b.best.price);
    else if (sort === 'precio_desc') rows.sort((a, b) => b.best.price - a.best.price);
    else if (sort === 'ahorro') rows.sort((a, b) => b.spreadPct - a.spreadPct);
    else if (sort === 'marca') rows.sort((a, b) => a.brand.localeCompare(b.brand));
    return rows;
  }

  async function byId(id) {
    const p = A.data.product(id);
    return p ? enrich(p) : null;
  }

  /** Ofertas destacadas de la semana. */
  async function deals(n) {
    const all = A.data.PRODUCTS.map(enrich).filter((p) => p.hasPromo);
    all.sort((a, b) => (b.best.discount || 0) - (a.best.discount || 0));
    return all.slice(0, n || 6);
  }

  A.api = A.api || {};
  A.api.materials = { search, byId, deals, enrich };
})(window.App);

(function (A) {
  'use strict';

  const STYLES = [
    { id:'moderno',      name:'Moderno',      en:'Modern',        pal:['#2B3A48','#8FA8C4','#E8EEF6'], desc:'Líneas rectas, materiales mixtos y mucha luz.' },

  ];

  const MATERIALS = [
    { id:'madera',      name:'Madera natural' },
    { id:'porcelanico', name:'Porcelánico gran formato' },
    { id:'microcemento',name:'Microcemento' },
    { id:'piedra',      name:'Piedra natural' },
    { id:'lacado',      name:'Lacado mate' },
    { id:'metal',       name:'Metal negro' },
    { id:'terrazo',     name:'Terrazo' },
    { id:'vidrio',      name:'Vidrio y transparencias' }
  ];

  const ROOMS = ['Cocina','Salón','Baño','Dormitorio','Terraza','Fachada','Oficina','Local comercial'];

  /** Construye el prompt que se enviaría al modelo. */
  function buildPrompt(o) {
    const st = STYLES.find((s) => s.id === o.style) || STYLES[0];
    const pal = PALETTES.find((p) => p.id === o.palette);
    const mats = (o.materials || []).map((m) => (MATERIALS.find((x) => x.id === m) || {}).name).filter(Boolean);
    return [
      `Fotografía de interiorismo arquitectónico de ${o.room || 'estancia'} reformada`,
      `estilo ${st.name.toLowerCase()}`,
      pal ? `paleta ${pal.name.toLowerCase()}` : '',
      mats.length ? `materiales: ${mats.join(', ')}` : '',
      o.desc ? `detalles: ${o.desc}` : '',
      'luz natural suave, lente 24 mm, render fotorrealista, alta resolución, sin personas'
    ].filter(Boolean).join(', ');
  }

  /** Previsualización procedural (sin red) — SVG determinista. */
  function preview(seed, o, variant) {
    const st = STYLES.find((s) => s.id === o.style) || STYLES[0];
    const pal = PALETTES.find((p) => p.id === o.palette);
    const cols = pal ? pal.colors : st.pal;
    const h = A.hash(seed + variant);
    const wallY = 150 + (h % 30);
    const rects = [];
    for (let i = 0; i < 9; i++) {
      const s = A.hash(seed + variant + i);
      const x = 20 + (s % 340), y = 60 + ((s >> 4) % 190);
      const w = 30 + ((s >> 8) % 130), hh = 20 + ((s >> 11) % 90);
      const c = cols[(s >> 14) % cols.length];
      const r = 2 + ((s >> 17) % 10);
      rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${r}" fill="${c}" opacity="${(0.35 + ((s >> 20) % 50) / 100).toFixed(2)}"/>`);
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${cols[0]}"/><stop offset="1" stop-color="${cols[1]}"/>
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${cols[2]}"/><stop offset="1" stop-color="${cols[1]}"/>
        </linearGradient>

      </defs>

      <rect y="${wallY}" width="400" height="${300 - wallY}" fill="url(#floor)"/>

    if (A.hasKey('integrations.aiRender.apiKey')) {

/* ============================================================
   app.js — Shell de la aplicación y enrutador
   ============================================================ */
(function (A) {
  'use strict';

  /* ---------------- Enrutador por hash ---------------- */
  const routes = [];
  function route(pattern, handler, meta) {
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:[a-zA-Z]+/g, (m) => { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    routes.push({ rx, keys, handler, meta: meta || {}, pattern });

(function (A) {
  'use strict';

  const STEPS = ['Servicio', 'Alcance', 'Calidad', 'Extras', 'Tus datos', 'Presupuesto'];

  /* Estado del asistente (persistido como borrador) */
  let W = null;
  function initWizard(serviceId) {
    const saved = A.state.draft;
    W = (saved && (!serviceId || saved.serviceId === serviceId)) ? saved : {
      step: serviceId ? 1 : 0,
      serviceId: serviceId || null,
      qty: null, quality:'estandar', province: (A.state.user && A.state.user.province) || 'Madrid',
      urgency:'normal', extras:[], vivienda2anios:true, obraNueva:false,
      client:{ name:(A.state.user && A.state.user.name) || '', email:(A.state.user && A.state.user.email) || '',
               phone:(A.state.user && A.state.user.phone) || '', address:'', notes:'' },
      materials: A.state.cart.slice()
    };
    if (serviceId) { W.serviceId = serviceId; if (W.step < 1) W.step = 1; }
    const svc = A.data.service(W.serviceId);
    if (svc && (W.qty == null)) W.qty = svc.qty.def;
    return W;
  }
  const save = () => A.draft.save(W);

  function stepper(step) {
    return `<div class="stepper">${STEPS.map((s, i) => `
      <div class="step ${i < step ? 'done' : ''} ${i === step ? 'active' : ''}" style="flex:${i === STEPS.length - 1 ? 0 : 1}">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="step-dot">${i < step ? '✓' : i + 1}</div>
        </div>
        ${i < STEPS.length - 1 ? '<div class="step-line"></div>' : ''}
      </div>`).join('')}</div>
      <div class="between" style="margin:-10px 0 16px">
        <span class="small muted">Paso ${step + 1} de ${STEPS.length}</span>
        <span class="small" style="font-weight:700;color:var(--primary)">${A.esc(STEPS[step])}</span>
      </div>`;
  }

  /* ---------------- Rutas ---------------- */
  A.route('/presupuesto', async () => wizard(null), { title:'Presupuesto' });
  A.route('/presupuesto/:id', async (p) => wizard(p.id), { title:'Presupuesto' });

  async function wizard(serviceId) {
    initWizard(serviceId);
    const svc = A.data.service(W.serviceId);
    A.onMount(bind);

    let body = '';
    if (W.step === 0 || !svc) body = stepService();
    else if (W.step === 1) body = stepScope(svc);
    else if (W.step === 2) body = stepQuality(svc);
    else if (W.step === 3) body = stepExtras(svc);
    else if (W.step === 4) body = stepClient(svc);
    else body = stepResult(svc);

    return `<div class="container" style="padding-top:16px;max-width:840px">
      <div class="between" style="margin-bottom:14px">
        <div>
          <div class="sec-title">${A.esc(A.t('quote.title'))}</div>
          <div class="sec-sub">${svc ? A.esc(svc.name) : 'Elige el trabajo que necesitas'}</div>
        </div>
        ${W.step > 0 ? `<button class="btn btn-ghost btn-sm" id="w-reset">${A.icon('refresh', 15)} Reiniciar</button>` : ''}
      </div>
      ${stepper(Math.min(W.step, 5))}
      ${body}
    </div>`;
  }

  /* ---- Paso 0: servicio ---- */
  function stepService() {
    return `<div class="stack">
      ${A.data.CATEGORIES.map((c) => `

          <div class="grid g3">
            ${A.data.servicesOf(c.id).map((s) => `
              <button class="opt" data-svc="${s.id}">
                <div class="opt-t">${A.esc(s.name)}</div>

              </button>`).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  }

  /* ---- Paso 1: alcance ---- */
  function stepScope(s) {
    return `<div class="card card-p">

          return `<button class="opt ${W.quality === q.id ? 'sel' : ''}" data-qual="${q.id}" style="display:block">

  function stepExtras(s) {

          <div style="font-size:17px;font-weight:700">${A.eur(q.pricePerUnit, 2)}</div></div>
        <div><div class="lbl">Calidad</div>
          <div style="font-size:17px;font-weight:700">${A.esc(q.quality.name)}</div></div>
      </div>
    </div>

    <div class="row wrap" style="gap:9px;margin-top:14px">
      <button class="btn" id="r-pdf">${A.icon('download', 18)} Descargar PDF</button>
      <button class="btn btn-wa" id="r-wa">${A.icon('whatsapp', 18)} WhatsApp</button>
      <button class="btn btn-ghost" id="r-mail">${A.icon('mail', 18)} Email</button>

    <div class="card card-p" style="margin-top:14px">
      <div class="between" style="margin-bottom:8px">
        <strong style="font-size:15px">Desglose de partidas</strong>
        ${q.minApplied ? '<span class="badge badge-amber">Mínimo facturable aplicado</span>' : ''}
      </div>
      ${Object.keys(groups).map((g) => {
        const rows = q.lines.filter((l) => l.group === g);
        if (!rows.length) return '';
        return `<div class="small muted" style="margin:12px 0 4px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">${groups[g]}</div>
          ${rows.map((l) => `<div class="line">
            <span style="flex:1">${A.esc(l.concept)}<br><span class="small muted">${A.esc(l.detail || '')}</span></span>
            <span>${A.eur(l.amount, 2)}</span></div>`).join('')}`;
      }).join('')}
      <hr class="divider">
      <div class="line"><span>${A.esc(A.t('quote.subtotal'))}</span><span>${A.eur(q.base, 2)}</span></div>
      <div class="line"><span>${A.esc(A.t('quote.vat'))} (${Math.round(q.vatRate * 100)} %)</span><span>${A.eur(q.vat, 2)}</span></div>
      <div class="line" style="font-size:17px"><span style="font-weight:800">TOTAL</span>
        <span style="font-weight:800">${A.eur(q.total)}</span></div>
    </div>

    <div class="grid g2" style="gap:12px;margin-top:12px">
      <div class="card card-p">
        <strong style="font-size:14.5px">El precio incluye</strong>
        <div class="stack" style="gap:7px;margin-top:9px">
          ${q.includes.map((i) => `<div class="row" style="gap:8px;align-items:flex-start">
            <span style="color:var(--green);flex:none">${A.icon('check', 15)}</span>
            <span class="small">${A.esc(i)}</span></div>`).join('')}
        </div>
      </div>
      <div class="card card-p">
        <strong style="font-size:14.5px">Plan de pagos</strong>
        <div style="margin-top:9px">
          ${q.payments.map((p) => `<div class="line">
            <span class="small">${Math.round(p.pct * 100)} % · ${A.esc(p.label)}</span>
            <span>${A.eur(p.amount)}</span></div>`).join('')}
        </div>
        <a class="btn btn-soft btn-sm btn-block" style="margin-top:12px" href="#/pagos">${A.icon('card', 16)} Pagar anticipo</a>
      </div>
    </div>

    <div class="card card-p" style="margin-top:12px">
      <div class="between wrap" style="gap:12px">
        <div><strong style="font-size:14.5px">¿Lo confirmamos con una visita técnica?</strong>
          <p class="small muted" style="margin-top:3px">Gratuita y sin compromiso. Convierte esta estimación en precio cerrado.</p></div>
        <a class="btn" href="#/citas">${A.icon('calendar', 17)} Reservar visita</a>
      </div>
    </div>

    <p class="small muted center" style="margin:14px 0 24px">${A.esc(A.t('quote.validity'))} ·
      Estimación calculada con tarifas de ${A.esc(q.province)} (coef. ${q.regionFactor.toFixed(2)}).</p>

    <div class="row" style="gap:10px;margin-bottom:24px">
      <button class="btn btn-ghost" data-step="3">${A.icon('back', 17)} Cambiar opciones</button>
      <a class="btn btn-ghost" style="flex:1" href="#/presupuestos">Ver mis presupuestos</a>
    </div>`;
  }

  /* ---------------- Eventos ---------------- */
  function bind() {
    const root = A.$('#outlet');
    const svc = A.data.service(W.serviceId);

    A.$$('[data-svc]').forEach((b) => b.addEventListener('click', () => {
      W.serviceId = b.dataset.svc;
      const s = A.data.service(W.serviceId);
      W.qty = s.qty.def; W.extras = []; W.step = 1; save(); A.render();
    }));
    A.$$('[data-step]').forEach((b) => b.addEventListener('click', () => {
      W.step = Number(b.dataset.step); save(); A.render();
    }));
    const reset = A.$('#w-reset');
    if (reset) reset.addEventListener('click', async () => {
      if (await A.confirm('Reiniciar presupuesto', '¿Seguro que quieres empezar de cero?', 'Reiniciar')) {
        A.draft.clear(); W = null; A.go('/presupuesto'); A.render();
      }
    });

    /* Paso alcance */
    const qv = A.$('#q-val'), qr = A.$('#q-range');
    const setQty = (v) => {
      W.qty = A.clamp(Number(v) || svc.qty.min, svc.qty.min, svc.qty.max);
      if (qv) qv.value = W.qty; if (qr) qr.value = W.qty; save();
    };
    if (qv) qv.addEventListener('input', (e) => setQty(e.target.value));
    if (qr) qr.addEventListener('input', (e) => setQty(e.target.value));
    const minus = A.$('#q-minus'), plus = A.$('#q-plus');
    if (minus) minus.addEventListener('click', () => setQty(W.qty - svc.qty.step));
    if (plus) plus.addEventListener('click', () => setQty(W.qty + svc.qty.step));
    const prov = A.$('#q-prov');
    if (prov) prov.addEventListener('change', (e) => { W.province = e.target.value; save(); });
    A.$$('[data-urg]').forEach((b) => b.addEventListener('click', () => {
      W.urgency = b.dataset.urg; save();
      A.$$('[data-urg]').forEach((x) => x.classList.toggle('sel', x === b));
    }));
    const iva = A.$('#q-iva');
    if (iva) iva.addEventListener('click', () => { W.vivienda2anios = !W.vivienda2anios; iva.classList.toggle('on', W.vivienda2anios); save(); });

    /* Calidad */
    A.$$('[data-qual]').forEach((b) => b.addEventListener('click', () => {
      W.quality = b.dataset.qual; save(); W.step = 3; A.render();
    }));

    /* Extras */
    A.$$('[data-extra]').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.extra, i = W.extras.indexOf(id);
      if (i === -1) W.extras.push(id); else W.extras.splice(i, 1);
      b.classList.toggle('sel'); save();
    }));
    const notes = A.$('#q-notes');
    if (notes) notes.addEventListener('input', (e) => { W.client.notes = e.target.value; save(); });
    const cm = A.$('#q-clearmat');
    if (cm) cm.addEventListener('click', () => { W.materials = []; A.cart.clear(); save(); A.render(); });

    /* Cliente */
    ['name', 'email', 'phone', 'address'].forEach((f) => {
      const el = A.$('#c-' + f);
      if (el) el.addEventListener('input', (e) => { W.client[f] = e.target.value; save(); });
    });
    const cons = A.$('#c-consent');
    if (cons) cons.addEventListener('click', () => { W.consent = !W.consent; cons.classList.toggle('on', W.consent); save(); });
    const calc = A.$('#c-calc');
    if (calc) calc.addEventListener('click', () => {
      const err = [];
      if (!A.v.required(W.client.name)) err.push('Indica tu nombre.');
      if (!A.v.email(W.client.email)) err.push('El correo no parece válido.');
      if (!A.v.phone(W.client.phone)) err.push('El teléfono no parece válido (9 dígitos).');
      if (!W.consent) err.push('Debes aceptar la política de privacidad.');
      const box = A.$('#c-error');
      if (err.length) { box.style.display = 'block'; box.innerHTML = err.map(A.esc).join('<br>'); return; }
      W.step = 5; save(); A.render();
    });

    /* Resultado */
    const q = W.result;
    const pdfBtn = A.$('#r-pdf');
    if (pdfBtn) pdfBtn.addEventListener('click', async () => {
      let rec; try { rec = await persist(q, 'borrador'); } catch (e) { return; }
      const blob = A.docs.quotePDF(q, W.client, rec.ref);
      A.download(`Presupuesto-${rec.ref}.pdf`, blob);
      A.toast('PDF descargado', 'ok');
    });
    const wa = A.$('#r-wa');
    if (wa) wa.addEventListener('click', async () => {
      let rec; try { rec = await persist(q, 'enviado'); } catch (e) { return; }
      const txt = encodeURIComponent(
        `*${A.data.COMPANY.legalName}* — Presupuesto ${rec.ref}\n\n` +
        `Trabajo: ${q.service.name}\nMedición: ${A.num(q.qty)} ${q.service.unitName}\n` +
        `Calidad: ${q.quality.name}\nProvincia: ${q.province}\n\n` +
        `*TOTAL: ${A.eur(q.total)}* (IVA incl.)\nPlazo: ${q.days} días laborables\n\n` +
        `Validez 30 días. ${A.data.COMPANY.phone}`);
      window.open(`https://wa.me/${A.data.COMPANY.whatsapp.replace(/[^\d]/g, '')}?text=${txt}`, '_blank');
      A.toast('Abriendo WhatsApp…');
    });
    const mail = A.$('#r-mail');
    if (mail) mail.addEventListener('click', async () => {
      let rec; try { rec = await persist(q, 'enviado'); } catch (e) { return; }
      const body = encodeURIComponent(
        `Hola ${W.client.name},\n\nAdjuntamos el resumen de tu presupuesto ${rec.ref}.\n\n` +
        `Trabajo: ${q.service.name}\nMedición: ${A.num(q.qty)} ${q.service.unitName}\n` +
        `Calidad: ${q.quality.name}\nBase imponible: ${A.eur(q.base, 2)}\nIVA: ${A.eur(q.vat, 2)}\n` +
        `TOTAL: ${A.eur(q.total)}\nPlazo estimado: ${q.days} días laborables\n\n` +
        `Puedes descargar el PDF desde tu área de cliente.\n\n${A.data.COMPANY.legalName}\n${A.data.COMPANY.phone}`);
      window.location.href = `mailto:${W.client.email}?subject=${encodeURIComponent('Presupuesto ' + rec.ref + ' · ' + A.data.COMPANY.name)}&body=${body}`;
    });
    const sv = A.$('#r-save');
    if (sv) sv.addEventListener('click', async () => {
      let rec; try { rec = await persist(q, 'borrador'); } catch (e) { return; }
      await A.notify('Presupuesto guardado', `${rec.ref} · ${q.service.name} · ${A.eur(q.total)}`, 'file-text', '#/presupuestos');
      A.toast('Guardado en tus presupuestos', 'ok');
      A.refreshBadge();
    });
  }

  /* Guarda (una sola vez por sesión de asistente) */
  async function persist(q, status) {
    if (!A.requireAuth('Entra en tu cuenta para guardar el presupuesto')) throw new Error('sesión requerida');
    if (W.savedRef) {
      const ex = await A.db.get('quotes', W.savedId);
      if (ex) { await A.db.update('quotes', W.savedId, { status }); return ex; }
    }
    const n = (await A.db.list('quotes')).length + 1;
    const rec = await A.db.insert('quotes', {
      user_id: A.state.user ? A.state.user.id : 'anon',
      ref: A.ref('PRES', n), service_id:q.service.id, service_name:q.service.name, category:q.service.cat,
      qty:q.qty, quality:q.quality.id, province:q.province, urgency:q.urgency.id,
      extras:W.extras, materials:W.materials, base:q.base, vat:q.vat, total:q.total, days:q.days,
      status: status || 'borrador',
      client_name:W.client.name, client_email:W.client.email, client_phone:W.client.phone,
      client_address:W.client.address, notes:W.client.notes || '', vivienda2anios:W.vivienda2anios
    });
    W.savedRef = rec.ref; W.savedId = rec.id; save();
    return rec;
  }

  /* ---------------- HISTORIAL ---------------- */
  const STATUS = {
    borrador:{ l:'Borrador', c:'badge-grey' }, enviado:{ l:'Enviado', c:'badge-navy' },
    aceptado:{ l:'Aceptado', c:'badge-green' }, en_obra:{ l:'En obra', c:'badge-amber' },
    finalizado:{ l:'Finalizado', c:'badge-green' }, rechazado:{ l:'Rechazado', c:'badge-red' }
  };
  A.ui.statusBadge = (s) => {
    const x = STATUS[s] || STATUS.borrador;
    return `<span class="badge ${x.c}">${x.l}</span>`;
  };

  A.route('/presupuestos', async () => {
    const rows = await A.db.list('quotes', A.state.user ? { user_id: A.state.user.id } : null);
    A.onMount(() => {
      A.$$('[data-del]').forEach((b) => b.addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();
        if (await A.confirm('Eliminar presupuesto', 'Esta acción no se puede deshacer.', 'Eliminar')) {
          await A.db.remove('quotes', b.dataset.del); A.render(); A.toast('Presupuesto eliminado');
        }
      }));
    });
    if (!rows.length) {
      return `<div class="container"><div class="empty" style="padding-top:60px">${A.icon('file-text', 44)}
        <h3>Todavía no tienes presupuestos</h3><p class="small">Calcula uno en menos de dos minutos.</p>
        <a class="btn" style="margin-top:16px" href="#/presupuesto">${A.icon('calc', 18)} Crear presupuesto</a></div></div>`;
    }
    const total = rows.reduce((s, r) => s + (r.total || 0), 0);
    return `<div class="container" style="padding-top:18px">
      <div class="between" style="margin-bottom:14px">
        <div><div class="sec-title">${A.esc(A.t('nav.quotes'))}</div>
          <div class="sec-sub">${rows.length} presupuestos · ${A.eur(total)} en total</div></div>
        <a class="btn btn-sm" href="#/presupuesto">${A.icon('plus', 16)} ${A.t('common.new')}</a>
      </div>
      <div class="stack">
        ${rows.map((r) => `<a class="card card-hover card-p" href="#/presupuesto-detalle/${r.id}">
          <div class="between" style="gap:10px">
            <div style="min-width:0">
              <div class="row" style="gap:7px;margin-bottom:4px">
                <span class="mono small muted">${A.esc(r.ref)}</span>${A.ui.statusBadge(r.status)}
              </div>
              <div style="font-weight:700;font-size:15px">${A.esc(r.service_name)}</div>
              <div class="small muted" style="margin-top:3px">
                ${A.num(r.qty)} ud · ${A.esc(r.province)} · ${A.dateFmt(r.created_at)}</div>
            </div>
            <div style="text-align:right;flex:none">
              <div style="font-weight:800;font-size:17px">${A.eur(r.total)}</div>
              <button class="link small" data-del="${r.id}" style="color:var(--red);margin-top:4px">Eliminar</button>
            </div>
          </div></a>`).join('')}
      </div><div style="height:20px"></div></div>`;
  }, { title:'Mis presupuestos' });

  /* ---------------- DETALLE ---------------- */
  A.route('/presupuesto-detalle/:id', async (p) => {
    const r = await A.db.get('quotes', p.id);
    if (!r) return `<div class="container"><div class="empty">${A.icon('alert', 40)}<h3>Presupuesto no encontrado</h3></div></div>`;
    const q = A.engine.quote({ serviceId:r.service_id, qty:r.qty, quality:r.quality, province:r.province,
      urgency:r.urgency, extras:r.extras || [], materials:r.materials || [], vivienda2anios:r.vivienda2anios });
    const client = { name:r.client_name, email:r.client_email, phone:r.client_phone, address:r.client_address };

    A.onMount(() => {
      A.$('#d-pdf').addEventListener('click', () => {
        A.download(`Presupuesto-${r.ref}.pdf`, A.docs.quotePDF(q, client, r.ref));
        A.toast('PDF descargado', 'ok');
      });
      A.$('#d-status').addEventListener('change', async (e) => {
        await A.db.update('quotes', r.id, { status:e.target.value });
        A.toast('Estado actualizado', 'ok');
      });
      A.$('#d-wa').addEventListener('click', () => {
        const txt = encodeURIComponent(`Presupuesto ${r.ref} — ${r.service_name}: ${A.eur(r.total)} (IVA incl.)`);
        window.open(`https://wa.me/${A.data.COMPANY.whatsapp.replace(/[^\d]/g, '')}?text=${txt}`, '_blank');
      });
    });

    return `<div class="container" style="padding-top:16px;max-width:840px">
      <a class="link" href="#/presupuestos">${A.icon('back', 15)} Volver</a>
      <div class="total-card" style="margin-top:12px">
        <div class="between"><div>
          <div class="lbl">${A.esc(r.ref)}</div>
          <div class="big">${A.eur(r.total)}</div>
          <div class="small" style="color:rgba(255,255,255,.7)">${A.esc(r.service_name)} · ${A.esc(r.province)}</div>
        </div>${A.ui.statusBadge(r.status)}</div>
      </div>
      <div class="row wrap" style="gap:9px;margin-top:14px">
        <button class="btn" id="d-pdf">${A.icon('download', 18)} PDF</button>
        <button class="btn btn-wa" id="d-wa">${A.icon('whatsapp', 18)} Compartir</button>
        <select class="select" id="d-status" style="width:auto;flex:1;min-width:150px">
          ${Object.keys(STATUS).map((k) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${STATUS[k].l}</option>`).join('')}
        </select>
      </div>
      <div class="card card-p" style="margin-top:14px">
        <strong style="font-size:15px">Partidas</strong>
        ${q.lines.map((l) => `<div class="line"><span style="flex:1">${A.esc(l.concept)}</span>
          <span>${A.eur(l.amount, 2)}</span></div>`).join('')}
        <hr class="divider">
        <div class="line"><span>Base imponible</span><span>${A.eur(q.base, 2)}</span></div>
        <div class="line"><span>IVA ${Math.round(q.vatRate * 100)} %</span><span>${A.eur(q.vat, 2)}</span></div>
        <div class="line" style="font-size:16px"><span style="font-weight:800">TOTAL</span>
          <span style="font-weight:800">${A.eur(q.total)}</span></div>
      </div>
      <div class="card card-p" style="margin-top:12px">
        <strong style="font-size:15px">Cliente</strong>
        <div class="line"><span class="muted">Nombre</span><span>${A.esc(r.client_name || '—')}</span></div>
        <div class="line"><span class="muted">Correo</span><span>${A.esc(r.client_email || '—')}</span></div>
        <div class="line"><span class="muted">Teléfono</span><span>${A.esc(r.client_phone || '—')}</span></div>
        <div class="line"><span class="muted">Dirección</span><span>${A.esc(r.client_address || '—')}</span></div>
        ${r.notes ? `<div class="line"><span class="muted">Notas</span><span>${A.esc(r.notes)}</span></div>` : ''}
        <div class="line"><span class="muted">Emitido</span><span>${A.dateFmt(r.created_at, true)}</span></div>
      </div>
      <div style="height:24px"></div>
    </div>`;
  }, { title:'Presupuesto' });
})(window.App);

/* ============================================================
   views/valuation.js — Avalúo de inmuebles
   ============================================================ */
(function (A) {
  'use strict';

  let V = null;
  function init() {
    V = A.store.get('nova.valdraft', null) || {
      step:0, address:'', province:(A.state.user && A.state.user.province) || 'Madrid',
      areaType:'ensanche', propertyType:'piso', m2:85, rooms:3, baths:1,
      year:1995, condition:'bueno', energy:'D', floor:2, cadastral:'',

  function form() {

          <div class="opt-t" style="font-size:13px">${A.esc(t.name)}</div></button>`).join('')}

          <input class="input mono" id="v-rooms" type="number" value="${V.rooms}" min="0" max="12"></div>

  A.ui.beforeAfter = function (id, beforeSrc, afterSrc, labels) {
    A.onMount(() => {
      const el = document.getElementById(id);
      if (!el) return;
      const move = (clientX) => {
        const r = el.getBoundingClientRect();
        const pct = A.clamp(((clientX - r.left) / r.width) * 100, 0, 100);
        el.style.setProperty('--pos', pct + '%');
      };
      /* Un único juego de escuchas globales por instancia montada */
      if (window.__baCleanup) window.__baCleanup();
      let dragging = false;
      const start = (e) => {
        dragging = true;
        if (e.preventDefault && !e.touches) e.preventDefault();   // evita el arrastre nativo de la imagen
        move(e.touches ? e.touches[0].clientX : e.clientX);
      };
      const mv = (e) => { if (dragging) { move(e.touches ? e.touches[0].clientX : e.clientX); e.preventDefault(); } };
      const end = () => { dragging = false; };
      el.addEventListener('dragstart', (e) => e.preventDefault());
      el.addEventListener('mousedown', start); el.addEventListener('touchstart', start, { passive:true });
      window.addEventListener('mousemove', mv); window.addEventListener('touchmove', mv, { passive:false });
      window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
      el.addEventListener('click', (e) => move(e.clientX));
      window.__baCleanup = () => {
        window.removeEventListener('mousemove', mv); window.removeEventListener('touchmove', mv);
        window.removeEventListener('mouseup', end); window.removeEventListener('touchend', end);
        window.__baCleanup = null;
      };
    });
    return `<div class="ba" id="${id}" style="--pos:50%">
      <div class="before"><img src="${beforeSrc}" alt="Antes" draggable="false" style="width:100%;height:100%;object-fit:cover"></div>

/* ============================================================
   views/materials.js — Comparador de materiales

(function (A) {
  'use strict';

  const F = { q:'', cat:'', sort:'relevancia', min:null, max:null, onlyStock:false, onlyPromo:false, store:'' };

  A.route('/materiales', async (p, qs) => {

      <div class="card card-p" style="margin-bottom:14px">

          <button class="btn" id="m-go" style="width:52px;padding:0">${A.icon('search', 19)}</button>
        </div>
        ${A.state.searches.length ? `<div class="row wrap" style="gap:6px;margin-top:10px">
          <span class="small muted">Recientes:</span>

        <div class="chips" style="margin-top:12px">
          <button class="chip ${!F.cat ? 'sel' : ''}" data-cat="">${A.t('common.all')}</button>
          ${A.data.MCATS.map((c) => `<button class="chip ${F.cat === c.id ? 'sel' : ''}" data-cat="${c.id}">${A.esc(c.name)}</button>`).join('')}
        </div>

        <div class="row wrap" style="gap:8px;margin-top:12px">
          <select class="select" id="m-sort" style="width:auto;flex:1;min-width:150px">
            <option value="relevancia">Relevancia</option>
            <option value="precio_asc">Precio: menor primero</option>
            <option value="precio_desc">Precio: mayor primero</option>
            <option value="ahorro">Mayor ahorro entre tiendas</option>
            <option value="marca">Marca (A-Z)</option>
          </select>
          <select class="select" id="m-store" style="width:auto;flex:1;min-width:150px">
            <option value="">Todas las tiendas</option>
            ${A.data.STORES.map((s) => `<option value="${s.id}">${A.esc(s.name)}</option>`).join('')}
          </select>
          <input class="input mono" id="m-min" type="number" placeholder="€ mín." style="width:110px">
          <input class="input mono" id="m-max" type="number" placeholder="€ máx." style="width:110px">
        </div>
        <div class="row wrap" style="gap:14px;margin-top:12px">
          <label class="row small" style="gap:7px;cursor:pointer">
            <input type="checkbox" id="m-stock"> Solo con stock</label>
          <label class="row small" style="gap:7px;cursor:pointer">
            <input type="checkbox" id="m-promo"> Solo ofertas</label>
        </div>
      </div>

      <div id="m-results"><div class="grid g3">
        ${[1,2,3,4,5,6].map(() => '<div class="card card-p"><div class="skel" style="height:120px;margin-bottom:10px"></div><div class="skel" style="height:14px;width:70%"></div></div>').join('')}
      </div></div>
      <div style="height:20px"></div>
    </div>`;
  }, { title:'Materiales' });

  function bind() {
    const q = A.$('#m-q');
    A.$('#m-go').addEventListener('click', () => { F.q = q.value; A.search.add(F.q); doSearch(); });
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { F.q = q.value; A.search.add(F.q); doSearch(); } });
    let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { F.q = q.value; doSearch(); }, 380); });
    A.$$('[data-cat]').forEach((b) => b.addEventListener('click', () => {
      F.cat = b.dataset.cat; A.$$('[data-cat]').forEach((x) => x.classList.toggle('sel', x === b)); doSearch();
    }));
    A.$$('[data-hist]').forEach((b) => b.addEventListener('click', () => { F.q = b.dataset.hist; q.value = F.q; doSearch(); }));
    const ch = A.$('#m-clearhist'); if (ch) ch.addEventListener('click', () => { A.search.clear(); A.render(); });
    A.$('#m-sort').addEventListener('change', (e) => { F.sort = e.target.value; doSearch(); });
    A.$('#m-store').addEventListener('change', (e) => { F.store = e.target.value; doSearch(); });
    A.$('#m-min').addEventListener('input', (e) => { F.min = e.target.value ? Number(e.target.value) : null; doSearch(); });
    A.$('#m-max').addEventListener('input', (e) => { F.max = e.target.value ? Number(e.target.value) : null; doSearch(); });
    A.$('#m-stock').addEventListener('change', (e) => { F.onlyStock = e.target.checked; doSearch(); });
    A.$('#m-promo').addEventListener('change', (e) => { F.onlyPromo = e.target.checked; doSearch(); });
    A.$('#m-sort').value = F.sort;
  }

  async function doSearch() {
    const box = A.$('#m-results');
    if (!box) return;
    box.innerHTML = `<div class="row center" style="justify-content:center;padding:34px;color:var(--text-3)">
      <span class="spinner"></span><span class="small" style="margin-left:10px">Consultando precios en 5 tiendas…</span></div>`;
    const rows = await A.api.materials.search(F);
    if (!rows.length) {
      box.innerHTML = `<div class="empty">${A.icon('search', 40)}<h3>Sin resultados</h3>
        <p class="small">Prueba con otra búsqueda o quita algún filtro.</p></div>`;
      return;
    }
    box.innerHTML = `<div class="small muted" style="margin-bottom:10px">${rows.length} productos ·
      precios actualizados ${A.dateFmt(new Date().toISOString(), true)}</div>
      <div class="grid g3">${rows.map(card).join('')}</div>`;
    A.$$('[data-add]').forEach((b) => b.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const p = rows.find((x) => x.id === b.dataset.add);
      A.cart.add({ id:p.id, name:p.name, price:p.best.price, store:p.best.storeName, unit:p.unit });
      const c = A.$('#cart-count'); if (c) c.textContent = A.state.cart.length;
      A.toast(`${p.brand} añadido a la cesta`, 'ok');
    }));
  }

  function card(p) {
    return `<a class="card card-hover" href="#/material/${p.id}" style="overflow:hidden;display:block">
      <div class="thumb" style="aspect-ratio:16/10"><img src="${p.img}" alt="">
        ${p.hasPromo ? '<span class="badge badge-red" style="position:absolute;top:8px;left:8px">Oferta</span>' : ''}
      </div>
      <div class="card-p" style="padding:13px">
        <div class="between" style="margin-bottom:3px">
          <span class="small muted">${A.esc(p.brand)}</span>
          <span class="mono small muted">${A.esc(p.ref)}</span>
        </div>
        <div style="font-weight:600;font-size:13.5px;line-height:1.35;min-height:36px">${A.esc(p.name)}</div>
        <div class="row" style="gap:6px;margin-top:9px">
          <span class="store-logo" style="background:${p.best.color}">${A.esc(p.best.short)}</span>
          <div style="flex:1;min-width:0">
            <div class="pricebar">
              <span class="price">${A.eur(p.best.price, 2)}</span>
              ${p.best.discount ? `<span class="price-old">${A.eur(p.best.listPrice, 2)}</span>` : ''}
            </div>
            <div class="small muted">${A.esc(p.best.storeName)} · ${A.esc(p.best.stock)}</div>
          </div>
        </div>
        <div class="between" style="margin-top:10px;gap:8px">
          <span class="badge ${p.spreadPct > 15 ? 'badge-green' : 'badge-grey'}">
            Ahorro ${A.eur(p.spread, 2)}</span>
          <button class="btn btn-soft btn-sm" data-add="${p.id}">${A.icon('plus', 15)} Añadir</button>
        </div>
      </div></a>`;
  }

  /* ---------------- Detalle de producto ---------------- */
  A.route('/material/:id', async (p) => {
    const prod = await A.api.materials.byId(p.id);
    if (!prod) return `<div class="container"><div class="empty">${A.icon('alert', 40)}<h3>Producto no encontrado</h3></div></div>`;
    A.onMount(() => {
      A.$$('[data-buy]').forEach((b) => b.addEventListener('click', () => {
        const o = prod.offers.find((x) => x.store === b.dataset.buy);
        A.cart.add({ id:prod.id, name:prod.name, price:o.price, store:o.storeName, unit:prod.unit });
        A.toast('Añadido a la cesta del presupuesto', 'ok');
      }));
      const al = A.$('#m-alert');
      if (al) al.addEventListener('click', async () => {
        await A.notify('Alerta de precio activada', `Te avisamos si ${prod.brand} baja de ${A.eur(prod.best.price, 2)}.`, 'tag', '#/material/' + prod.id);
        A.toast('Alerta creada', 'ok'); A.refreshBadge();
      });
    });
    const max = Math.max(...prod.offers.map((o) => o.price));
    return `<div class="container" style="padding-top:16px;max-width:820px">
      <a class="link" href="#/materiales">${A.icon('back', 15)} Comparador</a>
      <div class="grid g2" style="gap:16px;margin-top:12px">
        <div class="thumb" style="aspect-ratio:4/3"><img src="${prod.img}" alt=""></div>
        <div>
          <div class="small muted">${A.esc(prod.brand)} · ${A.esc(prod.ref)}</div>
          <h1 style="font-size:20px;margin-top:4px;letter-spacing:-.02em">${A.esc(prod.name)}</h1>
          <div class="row" style="gap:8px;margin-top:12px">
            <span class="price" style="font-size:27px">${A.eur(prod.best.price, 2)}</span>
            <span class="small muted">/ ${A.esc(prod.unit)}</span>
          </div>
          <div class="small muted">Mejor precio en ${A.esc(prod.best.storeName)}</div>
          <div class="row wrap" style="gap:8px;margin-top:14px">
            <button class="btn" data-buy="${prod.best.store}">${A.icon('cart', 18)} Añadir al presupuesto</button>
            <button class="btn btn-ghost" id="m-alert">${A.icon('bell', 17)} Avisarme si baja</button>
          </div>

      </div>

      <div class="card card-p" style="margin-top:16px">
        <div class="between" style="margin-bottom:12px">
          <strong style="font-size:15px">Comparativa de precios</strong>
          <span class="badge badge-green">Ahorras ${A.eur(prod.spread, 2)} (${A.num(prod.spreadPct, 0)} %)</span>
        </div>
        ${prod.offers.map((o, i) => `<div style="padding:11px 0;border-bottom:1px solid var(--border)">
          <div class="between" style="gap:10px">
            <div class="row" style="gap:9px;min-width:0">
              <span class="store-logo" style="background:${o.color}">${A.esc(o.short)}</span>
              <div style="min-width:0">
                <div style="font-weight:700;font-size:14px">${A.esc(o.storeName)}
                  ${i === 0 ? '<span class="badge badge-green" style="margin-left:5px">Mejor precio</span>' : ''}</div>
                <div class="small muted">${A.esc(o.delivery)}</div>

            </div>
            <div style="text-align:right;flex:none">
              <div class="pricebar" style="justify-content:flex-end">
                <span style="font-weight:800;font-size:16px">${A.eur(o.price, 2)}</span>
                ${o.discount ? `<span class="price-old">${A.eur(o.listPrice, 2)}</span>` : ''}
              </div>
              <div class="small ${o.stock === 'sin stock' ? '' : 'muted'}"
                style="${o.stock === 'sin stock' ? 'color:var(--red)' : ''}">
                ${A.esc(o.stock)}${o.units ? ` · ${o.units} ud.` : ''}</div>
            </div>
          </div>
          <div class="meter" style="margin-top:8px"><i style="width:${(o.price / max * 100).toFixed(1)}%;
            background:${i === 0 ? 'var(--green)' : 'var(--steel-400)'}"></i></div>
          <div class="between" style="margin-top:8px">
            <span class="small muted">${A.stars(o.rating, 12)} ${A.num(o.rating, 1)}</span>

          </div>
        </div>`).join('')}
      </div>
      <p class="small muted center" style="margin:14px 0 24px">
        ${A.hasKey('integrations.materialsApi.apiKey') ? 'Precios en tiempo real del proveedor conectado.'
          : 'Precios de referencia del simulador integrado. Conecta tu proveedor de precios en config.js para datos en vivo.'}</p>
    </div>`;
  }, { title:'Material' });

  /* ---------------- Cesta ---------------- */
  A.route('/cesta', async () => {
    A.onMount(() => {
      A.$$('[data-rm]').forEach((b) => b.addEventListener('click', () => { A.cart.remove(Number(b.dataset.rm)); A.render(); }));
      A.$$('[data-q]').forEach((i) => i.addEventListener('change', (e) => { A.cart.qty(Number(i.dataset.q), Number(e.target.value)); A.render(); }));
      const cl = A.$('#c-clear'); if (cl) cl.addEventListener('click', () => { A.cart.clear(); A.render(); });
      const go = A.$('#c-quote'); if (go) go.addEventListener('click', () => {
        const d = A.state.draft || {};
        d.materials = A.state.cart.slice(); A.draft.save(d); A.go('/presupuesto');
