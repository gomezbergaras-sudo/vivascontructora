# Publica la app en GitHub Pages cada vez que se sube algo a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar el archivo único (dist/index.html)
        run: node build.js

      - name: Comprobar que el paquete es válido
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const i = html.indexOf('<script>'), j = html.indexOf('</script>', i);
            new Function(html.slice(i + 8, j));
            console.log('Paquete correcto:', Math.round(html.length / 1024) + ' KB');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
